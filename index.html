<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c7f6b">
<meta name="description" content="e-Dawam — aplikasi guru Universiti Islam Selangor untuk kehadiran, hafazan dan rekod murid.">
<title>e-Dawam — Universiti Islam Selangor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/ikon-192.png">
<link rel="apple-touch-icon" href="assets/ikon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="e-Dawam">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="tajuk-utama">
  <div class="tajuk-kiri">
    <p id="tajuk-halaman" class="tajuk-muka">Utama</p>
    <span id="penunjuk-rangkaian" class="tajuk-status">Online</span>
  </div>
  <h1 class="tajuk-logo">
    <img src="assets/logo-dawam.png" alt="e-Dawam" width="444" height="160"
         draggable="false" decoding="async">
  </h1>
</header>

<main id="skrin" class="skrin" tabindex="-1"></main>

<nav class="nav-bawah" aria-label="Navigasi utama">
  <button class="nav-butang" data-tab="utama" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    <span>Utama</span>
  </button>
  <button class="nav-butang" data-tab="murid" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M17 11.5a2.6 2.6 0 100-5.2"/><path d="M18 20c0-2.3-.9-4-2.4-5"/></svg>
    <span>Murid</span>
  </button>
  <button class="nav-butang" data-tab="kehadiran" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10"/><path d="M4 12h10"/><path d="M4 18h7"/><path d="M16 16.5l2 2 4-4.5"/></svg>
    <span>Kehadiran</span>
  </button>
  <button class="nav-butang" data-tab="kalendar" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
    <span>Kalendar</span>
  </button>
  <button class="nav-butang" data-tab="rekod" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l4 4V20a1 1 0 01-1 1H6a1 1 0 01-1-1V4.5a1 1 0 011-1z"/><path d="M14.5 3.5V8H19"/><path d="M8.5 12.5h7"/><path d="M8.5 16.5h4.5"/></svg>
    <span>Rekod</span>
  </button>
  <button class="nav-butang" data-tab="sukatan" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M3 20h18"/></svg>
    <span>Sukatan</span>
  </button>
  <button class="nav-butang" data-tab="quran" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 016.5 3H12v17H6.5A2.5 2.5 0 004 22.5z"/><path d="M20 5.5A2.5 2.5 0 0017.5 3H12v17h5.5a2.5 2.5 0 012.5 2.5z"/></svg>
    <span>Al-Quran</span>
  </button>
  <button class="nav-butang" data-tab="nota" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h14v15l-4-3-3 2-3-2-4 3z"/><path d="M9 9h6"/><path d="M9 12.5h4"/></svg>
    <span>Nota</span>
  </button>
  <button class="nav-butang" data-tab="pasukan" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="2.8"/><circle cx="16.5" cy="9.5" r="2.3"/><path d="M2.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M15 14.2c2.7.1 4.5 2 4.5 4.8"/></svg>
    <span>Pasukan</span>
  </button>
</nav>

<div id="lapisan" class="lapisan tersembunyi" role="dialog" aria-modal="true" aria-labelledby="lapisan-tajuk">
  <div class="lapisan-kotak">
    <div class="lapisan-kepala">
      <h2 id="lapisan-tajuk">Tajuk</h2>
      <button id="lapisan-tutup" class="butang-ikon" type="button" aria-label="Tutup">&times;</button>
    </div>
    <div id="lapisan-kandungan" class="lapisan-kandungan"></div>
  </div>
</div>

<div id="toast" class="toast tersembunyi" role="status" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/cuti.js"></script>
<script src="js/sukatan.js"></script>
<script src="js/jadual.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/utama.js"></script>
<script src="js/views/murid.js"></script>
<script src="js/views/kehadiran.js"></script>
<script src="js/views/kalendar.js"></script>
<script src="js/views/rekod.js"></script>
<script src="js/views/sukatan.js"></script>
<script src="js/views/quran.js"></script>
<script src="js/views/nota.js"></script>
<script src="js/views/pasukan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
