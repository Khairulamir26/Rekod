      '" placeholder="Nama penuh murid" autocomplete="off"></div>' +

      '<div class="medan"><label for="m-matrik">Nombor matrik</label>' +
      '<input id="m-matrik" type="text" value="' + u.selamat(m.matrik || '') +
      '" placeholder="Contoh: UIS2026001" autocomplete="off"></div>' +

      '<div class="medan"><label for="m-telefon">Nombor telefon</label>' +
      '<input id="m-telefon" type="tel" value="' + u.selamat(m.telefon || '') +
      '" placeholder="Contoh: 012-3456789" autocomplete="off"></div>' +

      '<div class="medan-dua">' +
      '<div class="medan"><label for="m-semester">Semester</label>' +
      '<select id="m-semester">' + CT.ui.pilihanNombor(1, 8, m.semester || 1) + '</select></div>' +
      '<div class="medan"><label for="m-hifz">Hifz / I\'adah</label>' +
      '<select id="m-hifz">' + CT.ui.pilihanNombor(1, 8, m.hifz || 1) + '</select></div>' +
      '</div>' +

      '<button class="butang butang-penuh" type="button" data-simpan>Simpan murid</button>';

    kotak.querySelector('[data-simpan]').addEventListener('click', function () {
      var nama = kotak.querySelector('#m-nama').value.trim();
      if (!nama) { CT.ui.toast('Sila isi nama penuh murid.'); return; }

      CT.store.simpanMurid({
        id: m.id,
        dicipta: m.dicipta,
        nama: nama,
        matrik: kotak.querySelector('#m-matrik').value.trim(),
        telefon: kotak.querySelector('#m-telefon').value.trim(),
        semester: +kotak.querySelector('#m-semester').value,
        hifz: +kotak.querySelector('#m-hifz').value
      });
      CT.ui.tutupLapisan();
      CT.ui.toast(m.id ? 'Profil murid dikemas kini.' : 'Murid baharu ditambah.');
      CT.app.segarSemula();
    });

    return kotak;
  }

  function bukaBorang(sedia) {
    CT.ui.bukaLapisan(sedia ? 'Sunting Profil Murid' : 'Tambah Murid', borang(sedia));
  }

  /* ---------- Profil ---------- */
  function bukaProfil(id) {
    var m = CT.store.ambilMurid(id);
    if (!m) { return; }

    var kotak = document.createElement('div');
    kotak.innerHTML =
      '<div class="kad">' +
      '<div class="baris"><span class="avatar">' + u.selamat(u.huruf(m.nama)) + '</span>' +
      '<span class="tumbuh"><span class="murid-nama">' + u.selamat(m.nama) + '</span></span></div>' +
      '<div class="rekod-medan">' +
      '<div><b>Nombor matrik</b>' + u.selamat(m.matrik || 'Tiada') + '</div>' +
      '<div><b>Nombor telefon</b>' + u.selamat(m.telefon || 'Tiada') + '</div>' +
      '<div><b>Semester</b>' + u.selamat(m.semester || '-') + '</div>' +
      '<div><b>Hifz / I\'adah</b>' + u.selamat(m.hifz || '-') + '</div>' +
      '</div></div>' +

      '<div class="baris-lipat jarak-atas">' +
      '<button class="butang tumbuh" type="button" data-sunting>Sunting profil</button>' +
      '<button class="butang butang-luar tumbuh" type="button" data-rekod>Lihat rekod hari ini</button>' +
      '</div>' +
      '<button class="butang butang-bahaya butang-penuh jarak-atas" type="button" data-padam>' +
      'Padam murid</button>';

    kotak.querySelector('[data-sunting]').addEventListener('click', function () {
      bukaBorang(m);
    });
    kotak.querySelector('[data-rekod]').addEventListener('click', function () {
      CT.ui.tutupLapisan();
      CT.app.pergi('rekod', { tarikh: u.hariIni() });
    });
    kotak.querySelector('[data-padam]').addEventListener('click', function () {
      CT.ui.sahkan('Padam murid',
        'Padam ' + m.nama + ' bersama semua kehadiran, rekod dan nota murid ini? ' +
        'Tindakan ini tidak boleh dibatalkan.',
        function () {
          CT.store.padamMurid(m.id);
          CT.ui.toast('Murid dipadam.');
          CT.app.segarSemula();
        }, 'Ya, padam');
    });

    CT.ui.bukaLapisan('Profil Murid', kotak);
  }

  /* ---------- Data contoh (pilihan guru) ---------- */
  function muatContoh() {
    var contoh = [
      { nama: 'Ahmad Danial bin Rosli', matrik: 'UIS2026001', telefon: '012-3456789', semester: 1, hifz: 1 },
      { nama: 'Nur Aisyah binti Kamal', matrik: 'UIS2026002', telefon: '013-2233445', semester: 2, hifz: 3 },
      { nama: 'Muhammad Haziq bin Zainal', matrik: 'UIS2026003', telefon: '011-98765432', semester: 3, hifz: 2 },
      { nama: 'Siti Khadijah binti Anuar', matrik: 'UIS2026004', telefon: '019-7766554', semester: 4, hifz: 5 },
      { nama: 'Amir Hamzah bin Ibrahim', matrik: 'UIS2026005', telefon: '017-4455667', semester: 5, hifz: 4 }
    ];
    contoh.forEach(function (m) { CT.store.simpanMurid(m); });
    CT.ui.toast('5 murid contoh ditambah.');
    CT.app.segarSemula();
  }

  function render(skrin) {
    var semua = CT.store.senaraiMurid();

    var kepala = document.createElement('div');
    kepala.className = 'seksyen';
    kepala.innerHTML =
      '<div class="medan" style="margin-bottom:10px">' +
      '<input type="search" id="cari-murid" placeholder="Cari nama, matrik atau telefon" ' +
      'value="' + u.selamat(carian) + '" aria-label="Cari murid"></div>' +
      '<button class="butang butang-penuh" type="button" data-tambah>+ Tambah Murid</button>';
    kepala.querySelector('[data-tambah]').addEventListener('click', function () { bukaBorang(null); });

    var medanCari = kepala.querySelector('#cari-murid');
    medanCari.addEventListener('input', function () {
      carian = medanCari.value;
      lukisSenarai();
    });
    skrin.appendChild(kepala);

    var seksyen = document.createElement('div');
    seksyen.className = 'seksyen';
    skrin.appendChild(seksyen);

    function lukisSenarai() {
      seksyen.innerHTML = '';
      if (!semua.length) {
        var butang = document.createElement('button');
        butang.type = 'button';
        butang.className = 'butang butang-luar butang-kecil jarak-atas';
        butang.textContent = 'Muat 5 murid contoh';
        butang.addEventListener('click', muatContoh);
        seksyen.appendChild(CT.ui.kosong('Belum ada murid',
          'Tekan "Tambah Murid" untuk memasukkan murid pertama anda.', butang));
        return;
      }

      var ditapis = tapis(semua);
      var kira = document.createElement('p');
      kira.className = 'seksyen-tajuk';
      kira.textContent = ditapis.length + ' daripada ' + semua.length + ' murid';
      seksyen.appendChild(kira);

      if (!ditapis.length) {
        seksyen.appendChild(CT.ui.kosong('Tiada padanan',
          'Tiada murid sepadan dengan carian "' + carian + '".'));
        return;
      }

      var senarai = document.createElement('div');
      senarai.className = 'senarai';
      ditapis.forEach(function (m) { senarai.appendChild(kadMurid(m)); });
      seksyen.appendChild(senarai);
    }

    lukisSenarai();
  }

  return { tajuk: 'Murid', render: render, bukaBorang: bukaBorang };
})();

</script>

<script>
/* js/views/kehadiran.js */
/* Tab Kehadiran — dua pilihan sahaja bagi setiap murid: Hadir atau Tidak hadir.
   Rekod disimpan mengikut tarikh dan terus dipaparkan dalam tab Kalendar dan Rekod. */

window.CT = window.CT || {};
CT.views = CT.views || {};

CT.views.kehadiran = (function () {
  'use strict';

  var u = CT.util;
  var tarikh = null;
  var draf = {};
  var belumSimpan = false;

  function muatDraf() {
    draf = Object.assign({}, CT.store.kehadiranTarikh(tarikh));
    belumSimpan = false;
  }

  function kiraan(murid) {
    var hadir = 0, tidak = 0;
    murid.forEach(function (m) {
      if (draf[m.id] === 'hadir') { hadir++; }
      else if (draf[m.id] === 'tidak') { tidak++; }
    });
    return { hadir: hadir, tidak: tidak, jumlah: murid.length, belum: murid.length - hadir - tidak };
  }

  function render(skrin, param) {
    if (param && param.tarikh && u.sahKunci(param.tarikh)) {
      tarikh = param.tarikh;
      muatDraf();
    } else if (!tarikh) {
      tarikh = u.hariIni();
      muatDraf();
    } else if (!belumSimpan) {
      muatDraf();
    }

    var murid = CT.store.senaraiMurid();

    /* Pemilih tarikh */
    skrin.appendChild(CT.ui.pemilihTarikh(tarikh, function (baru) {
      tarikh = baru;
      muatDraf();
      CT.app.segarSemula();
    }));

    /* Notis cuti umum */
    var cuti = CT.ui.notisCuti(tarikh);
    if (cuti) {
      cuti.classList.add('jarak-atas');
      skrin.appendChild(cuti);
    }

    if (!murid.length) {
      var kosong = CT.ui.kosong('Belum ada murid',
        'Tambah murid dalam tab Murid sebelum mengambil kehadiran.');
      kosong.classList.add('jarak-atas');
      skrin.appendChild(kosong);
      return;
    }

    /* Statistik */
    var statistik = document.createElement('div');
    statistik.className = 'statistik jarak-atas';
    skrin.appendChild(statistik);

    function lukisStatistik() {
      var k = kiraan(murid);
      statistik.innerHTML =
        '<div class="stat"><b style="color:var(--hijau)">' + k.hadir + '</b><span>Hadir</span></div>' +
        '<div class="stat"><b style="color:var(--merah)">' + k.tidak + '</b><span>Tidak hadir</span></div>' +
        '<div class="stat"><b>' + u.peratus(k.hadir, k.jumlah) + '%</b><span>Peratus kehadiran</span></div>';
    }

    /* Senarai murid */
    var senarai = document.createElement('div');
    senarai.className = 'senarai jarak-atas';
    skrin.appendChild(senarai);

    murid.forEach(function (m) {
      var baris = document.createElement('div');
      baris.className = 'hadir-baris';
      baris.innerHTML =
        '<span class="avatar">' + u.selamat(u.huruf(m.nama)) + '</span>' +
        '<span class="tumbuh"><span class="murid-nama">' + u.selamat(m.nama) + '</span><br>' +
        '<span class="kecil">' + u.selamat(m.matrik || 'Tiada matrik') + '</span></span>' +
        '<span class="segmen">' +
        '<button type="button" data-nilai="hadir">Hadir</button>' +
        '<button type="button" data-nilai="tidak">Tidak</button>' +
        '</span>';

      var butangHadir = baris.querySelector('[data-nilai="hadir"]');
      var butangTidak = baris.querySelector('[data-nilai="tidak"]');

      function segar() {
        butangHadir.classList.toggle('pilih-hadir', draf[m.id] === 'hadir');
        butangTidak.classList.toggle('pilih-tidak', draf[m.id] === 'tidak');
      }

      function pilih(nilai) {
        draf[m.id] = draf[m.id] === nilai ? undefined : nilai;
        if (!draf[m.id]) { delete draf[m.id]; }
        belumSimpan = true;
        segar();
        lukisStatistik();
      }

      butangHadir.addEventListener('click', function () { pilih('hadir'); });
      butangTidak.addEventListener('click', function () { pilih('tidak'); });
      baris.segar = segar;
      segar();
      senarai.appendChild(baris);
    });

    lukisStatistik();

    /* Butang tindakan */
    var bar = document.createElement('div');
    bar.className = 'bar-tindakan';
    bar.innerHTML =
      '<button class="butang butang-luar tumbuh" type="button" data-semua>Semua hadir</button>' +
      '<button class="butang tumbuh" type="button" data-simpan>Simpan kehadiran</button>';

    bar.querySelector('[data-semua]').addEventListener('click', function () {
      murid.forEach(function (m) { draf[m.id] = 'hadir'; });
      belumSimpan = true;
      Array.prototype.forEach.call(senarai.children, function (b) { b.segar && b.segar(); });
      lukisStatistik();
      CT.ui.toast('Semua murid ditanda hadir. Tekan "Simpan kehadiran".');
    });

    bar.querySelector('[data-simpan]').addEventListener('click', function () {
      var bersih = {};
      Object.keys(draf).forEach(function (id) {
        if (draf[id] === 'hadir' || draf[id] === 'tidak') { bersih[id] = draf[id]; }
      });
      CT.store.simpanKehadiran(tarikh, bersih);
      belumSimpan = false;
      var k = kiraan(murid);
      CT.ui.toast('Kehadiran ' + u.tarikhRingkas(tarikh) + ' disimpan (' +
        k.hadir + ' hadir, ' + k.tidak + ' tidak hadir).');
    });

    skrin.appendChild(bar);

    var pautan = document.createElement('button');
    pautan.type = 'button';
    pautan.className = 'butang butang-lembut butang-penuh jarak-atas';
    pautan.textContent = 'Buka rekod murid untuk tarikh ini';
    pautan.addEventListener('click', function () {
      CT.app.pergi('rekod', { tarikh: tarikh });
    });
    skrin.appendChild(pautan);
  }

  function tetapTarikh(baru) {
    if (u.sahKunci(baru)) { tarikh = baru; muatDraf(); }
  }

  return { tajuk: 'Kehadiran', render: render, tetapTarikh: tetapTarikh };
})();

</script>

<script>
/* js/views/kalendar.js */
/* Tab Kalendar — kalendar bulanan aktif.
   Menggabungkan cuti Persekutuan + Kuala Lumpur + Selangor secara automatik
   (tiada pemilih negeri dipaparkan). Rekod murid tidak disenaraikan di sini
   kerana ia mempunyai tab sendiri. */

window.CT = window.CT || {};
CT.views = CT.views || {};

CT.views.kalendar = (function () {
  'use strict';

  var u = CT.util;
  var pilih = null;   // tarikh dipilih
  var lihat = null;   // { tahun, bulan }

  function pastikanKeadaan(param) {
    if (param && param.tarikh && u.sahKunci(param.tarikh)) { pilih = param.tarikh; }
    if (!pilih) { pilih = u.hariIni(); }
    var p = u.pecah(pilih);
    if (!lihat || (param && param.tarikh)) { lihat = { tahun: p.tahun, bulan: p.bulan }; }
  }

  function tukarBulan(langkah) {
    var bulan = lihat.bulan + langkah;
    var tahun = lihat.tahun;
    while (bulan > 12) { bulan -= 12; tahun++; }
    while (bulan < 1) { bulan += 12; tahun--; }
    lihat = { tahun: tahun, bulan: bulan };
    CT.app.segarSemula();
  }

  function tandaTarikh() {
    var tanda = {};
    CT.store.tarikhAdaRekod().forEach(function (t) {
      tanda[t] = tanda[t] || {};
      tanda[t].rekod = true;
    });
    CT.store.tarikhAdaAcara().forEach(function (t) {
      tanda[t] = tanda[t] || {};
      tanda[t].acara = true;
    });
    return tanda;
  }

  function gridBulan() {
    var kad = document.createElement('div');
    kad.className = 'kad';

    var kepala = document.createElement('div');
    kepala.className = 'kal-kepala';
    kepala.innerHTML =
      '<button class="butang-ikon" type="button" data-bulan-sebelum aria-label="Bulan sebelumnya">&lsaquo;</button>' +
      '<span class="kal-bulan">' + u.namaBulan(lihat.bulan) + ' ' + lihat.tahun + '</span>' +
      '<button class="butang-ikon" type="button" data-bulan-selepas aria-label="Bulan berikutnya">&rsaquo;</button>';
    kepala.querySelector('[data-bulan-sebelum]').addEventListener('click', function () { tukarBulan(-1); });
    kepala.querySelector('[data-bulan-selepas]').addEventListener('click', function () { tukarBulan(1); });
    kad.appendChild(kepala);

    var grid = document.createElement('div');
    grid.className = 'kal-grid';

    u.HARI_PENDEK.forEach(function (h) {
      var sel = document.createElement('div');
      sel.className = 'kal-nama';
      sel.textContent = h;
      grid.appendChild(sel);
    });

    var pertama = u.bina(lihat.tahun, lihat.bulan, 1);
    var mula = u.hariMinggu(pertama);
    var hariDalamBulan = new Date(Date.UTC(lihat.tahun, lihat.bulan, 0)).getUTCDate();
    var tanda = tandaTarikh();
    var ini = u.hariIni();

    for (var kosong = 0; kosong < mula; kosong++) {
      var lompang = document.createElement('div');
      lompang.className = 'kal-sel luar';
      grid.appendChild(lompang);
    }

    for (var hari = 1; hari <= hariDalamBulan; hari++) {
      (function (hari) {
        var kunci = u.bina(lihat.tahun, lihat.bulan, hari);
        var sel = document.createElement('button');
        sel.type = 'button';
        sel.className = 'kal-sel';
        if (kunci === ini) { sel.classList.add('hari-ini'); }
        if (kunci === pilih) { sel.classList.add('pilih'); }
        var adaCuti = CT.cuti.adaCuti(kunci);
        if (adaCuti) { sel.classList.add('cuti'); }

        var titik = '';
        if (tanda[kunci] && tanda[kunci].rekod) { titik += '<i class="t-rekod"></i>'; }
        if (tanda[kunci] && tanda[kunci].acara) { titik += '<i class="t-acara"></i>'; }
        if (adaCuti) { titik += '<i class="t-cuti"></i>'; }

        sel.innerHTML = '<span>' + hari + '</span><span class="kal-titik">' + titik + '</span>';
        sel.setAttribute('aria-label', u.tarikhPenuh(kunci));
        sel.addEventListener('click', function () {
          pilih = kunci;
          CT.app.segarSemula();
        });
        grid.appendChild(sel);
      })(hari);
    }

    kad.appendChild(grid);

    var petunjuk = document.createElement('div');
    petunjuk.className = 'petunjuk';
    petunjuk.innerHTML =
      '<span><i class="t-rekod"></i> Ada rekod murid</span>' +
      '<span><i class="t-acara"></i> Ada acara</span>' +
      '<span><i class="t-cuti"></i> Cuti umum</span>';
    kad.appendChild(petunjuk);

    return kad;
  }

  /* ---------- Borang acara ---------- */
  function borangAcara(sedia) {
    var a = sedia || {};
    var kotak = document.createElement('div');
    kotak.innerHTML =
      '<p class="kecil tebal" style="margin-bottom:12px">' + u.selamat(u.tarikhPenuh(pilih)) + '</p>' +
      '<div class="medan"><label for="a-tajuk">Tajuk acara</label>' +
      '<input id="a-tajuk" type="text" value="' + u.selamat(a.tajuk || '') +
      '" placeholder="Contoh: Ujian hafazan juz 1"></div>' +
      '<div class="medan-dua">' +
      '<div class="medan"><label for="a-jenis">Jenis</label><select id="a-jenis">' +
      ['Aktiviti kelas', 'Tugasan', 'Mesyuarat', 'Lain-lain'].map(function (j) {
        return '<option' + (a.jenis === j ? ' selected' : '') + '>' + j + '</option>';
      }).join('') + '</select></div>' +
      '<div class="medan"><label for="a-masa">Masa</label>' +
      '<input id="a-masa" type="time" value="' + u.selamat(a.masa || '08:00') + '"></div>' +
      '</div>' +
      '<div class="medan"><label for="a-catatan">Catatan</label>' +
      '<textarea id="a-catatan" placeholder="Butiran tambahan (pilihan)">' +
      u.selamat(a.catatan || '') + '</textarea></div>' +
      '<button class="butang butang-penuh" type="button" data-simpan>Simpan acara</button>' +
      (a.id ? '<button class="butang butang-bahaya butang-penuh jarak-atas" type="button" data-padam>Padam acara</button>' : '');

    kotak.querySelector('[data-simpan]').addEventListener('click', function () {
      var tajuk = kotak.querySelector('#a-tajuk').value.trim();
      if (!tajuk) { CT.ui.toast('Sila isi tajuk acara.'); return; }
      CT.store.simpanAcara(pilih, {
        id: a.id,
        tajuk: tajuk,
        jenis: kotak.querySelector('#a-jenis').value,
        masa: kotak.querySelector('#a-masa').value,
        catatan: kotak.querySelector('#a-catatan').value.trim()
      });
      CT.ui.tutupLapisan();
      CT.ui.toast('Acara disimpan.');
      CT.app.segarSemula();
    });

    if (a.id) {
      kotak.querySelector('[data-padam]').addEventListener('click', function () {
        CT.store.padamAcara(pilih, a.id);
        CT.ui.tutupLapisan();
        CT.ui.toast('Acara dipadam.');
        CT.app.segarSemula();
      });
    }
    return kotak;
  }

  /* ---------- Panel tarikh dipilih ---------- */
  function panelTarikh() {
    var kad = document.createElement('div');
    kad.className = 'kad jarak-atas';

    var kepala = document.createElement('div');
    kepala.className = 'baris-antara';
    kepala.innerHTML =
      '<span class="tumbuh"><span class="tebal">' + u.selamat(u.tarikhPenuh(pilih)) + '</span><br>' +
      '<span class="kecil">' + u.selamat(u.tarikhRingkas(pilih)) + '</span></span>' +
      '<button class="butang butang-lembut butang-kecil" type="button" data-hari-ini>Hari Ini</button>';
    kepala.querySelector('[data-hari-ini]').addEventListener('click', function () {
      pilih = u.hariIni();
      var p = u.pecah(pilih);
      lihat = { tahun: p.tahun, bulan: p.bulan };
      CT.app.segarSemula();
    });
    kad.appendChild(kepala);

    var cuti = CT.ui.notisCuti(pilih);
    if (cuti) { cuti.classList.add('jarak-atas'); kad.appendChild(cuti); }

    var acara = CT.store.acaraTarikh(pilih);
    var senarai = document.createElement('div');
    senarai.className = 'jarak-atas';

    if (!acara.length) {
      senarai.innerHTML = '<p class="kecil kosong">Tiada acara pada tarikh ini.</p>';
    } else {
      acara.forEach(function (a) {
        var baris = document.createElement('div');
        baris.className = 'acara-baris';
        baris.innerHTML =
          '<span class="acara-masa">' + u.selamat(u.masa12(a.masa) || '-') + '</span>' +
          '<span class="tumbuh"><span class="tebal">' + u.selamat(a.tajuk) + '</span><br>' +
          '<span class="lencana lencana-kelabu">' + u.selamat(a.jenis || 'Lain-lain') + '</span>' +
          (a.catatan ? '<br><span class="kecil">' + u.selamat(a.catatan) + '</span>' : '') +
          '</span>' +
          '<button class="butang butang-luar butang-kecil" type="button" data-sunting>Sunting</button>';
        baris.querySelector('[data-sunting]').addEventListener('click', function () {
          CT.ui.bukaLapisan('Sunting Acara', borangAcara(a));
        });
        senarai.appendChild(baris);
      });
    }
    kad.appendChild(senarai);

    var tambah = document.createElement('button');
    tambah.type = 'button';
    tambah.className = 'butang butang-penuh jarak-atas';
    tambah.textContent = '+ Tambah Acara';
    tambah.addEventListener('click', function () {
      CT.ui.bukaLapisan('Tambah Acara', borangAcara(null));
    });
    kad.appendChild(tambah);

    var kePeringkat = document.createElement('div');
    kePeringkat.className = 'baris-lipat jarak-atas';
    kePeringkat.innerHTML =
      '<button class="butang butang-lembut tumbuh" type="button" data-kehadiran>Kehadiran tarikh ini</button>' +
      '<button class="butang butang-lembut tumbuh" type="button" data-rekod>Rekod tarikh ini</button>';
    kePeringkat.children[0].addEventListener('click', function () {
      CT.app.pergi('kehadiran', { tarikh: pilih });
    });
    kePeringkat.children[1].addEventListener('click', function () {
      CT.app.pergi('rekod', { tarikh: pilih });
    });
    kad.appendChild(kePeringkat);

    return kad;
  }

  /* ---------- Bar penyegerakan ---------- */
  function barSegerak() {
    var kad = document.createElement('div');
    kad.className = 'kad kad-rapat jarak-atas';

    var status = CT.cuti.statusSegerak(lihat.tahun);
    var teks = status.sumber === 'segerak'
      ? 'Cuti umum disegerakkan pada ' + u.capMasa(status.masa)
      : 'Menggunakan data cuti luar talian.';

    kad.innerHTML =
      '<div class="baris-antara">' +
      '<span class="kecil tumbuh" data-status>' + u.selamat(teks) + '</span>' +
      '<button class="butang butang-luar butang-kecil" type="button" data-segerak>Segerak</button>' +
      '</div>';

    var butang = kad.querySelector('[data-segerak]');
    butang.addEventListener('click', function () {
      butang.disabled = true;
      butang.textContent = 'Menyegerak...';
      CT.cuti.segerak(lihat.tahun, true).then(function (hasil) {
        if (hasil.status === 'ok') {
          CT.ui.toast('Kalendar cuti dikemas kini (' + hasil.bilangan + ' cuti).');
          CT.app.segarSemula();
        } else if (hasil.status === 'luar-talian') {
          CT.ui.toast('Tiada internet. Data luar talian digunakan.');
          butang.disabled = false;
          butang.textContent = 'Segerak';
        } else {
          CT.ui.toast('Penyegerakan gagal. Data luar talian digunakan.');
          butang.disabled = false;
          butang.textContent = 'Segerak';
        }
      });
    });
    return kad;
  }

  function render(skrin, param) {
    pastikanKeadaan(param);
    skrin.appendChild(gridBulan());
    skrin.appendChild(panelTarikh());
    skrin.appendChild(barSegerak());

    // Cuba segerak senyap sekali bagi tahun yang dilihat.
    CT.cuti.segerak(lihat.tahun, false).then(function (hasil) {
      if (hasil.status === 'ok') { CT.app.segarSemula(); }
    });
  }

  return { tajuk: 'Kalendar', render: render };
})();

</script>

<script>
/* js/views/rekod.js */
/* Tab Rekod — lihat dan kemas kini rekod setiap murid mengikut tarikh dipilih.
   Setiap tarikh disimpan berasingan: mengubah rekod satu tarikh tidak menyentuh
   rekod tarikh lain. */

window.CT = window.CT || {};
CT.views = CT.views || {};

CT.views.rekod = (function () {
  'use strict';

  var u = CT.util;
  var tarikh = null;

  function labelKehadiran(nilai) {
    if (nilai === 'hadir') { return '<span class="lencana">Hadir</span>'; }
    if (nilai === 'tidak') { return '<span class="lencana lencana-merah">Tidak hadir</span>'; }
    return '<span class="lencana lencana-kelabu">Belum direkod</span>';
  }

  /* ---------- Borang kemas kini seorang murid ---------- */
  function borang(murid) {
    var r = CT.store.rekodMurid(tarikh, murid.id) || {};
    var hadir = CT.store.kehadiranTarikh(tarikh)[murid.id] || '';
    var nota = CT.store.notaHarian(tarikh, murid.id);

    var kotak = document.createElement('div');
    kotak.innerHTML =
      '<p class="kecil tebal" style="margin-bottom:4px">' + u.selamat(murid.nama) + '</p>' +
      '<p class="kecil" style="margin-bottom:14px">' + u.selamat(u.tarikhPenuh(tarikh)) + '</p>' +

      '<div class="medan"><label>Kehadiran</label>' +
      '<div class="segmen">' +
      '<button type="button" data-hadir="hadir">Hadir</button>' +
      '<button type="button" data-hadir="tidak">Tidak hadir</button>' +
      '</div></div>' +

      '<div class="medan"><label for="r-juz">Juz</label><select id="r-juz">' +
      '<option value="">Juz belum direkod</option>' +
      CT.ui.pilihanNombor(1, 30, r.juz) + '</select></div>' +

      '<div class="medan-dua">' +
      '<div class="medan"><label for="r-mula">Muka surat hafazan mula</label>' +
      '<input id="r-mula" type="number" min="1" max="604" inputmode="numeric" value="' +
      u.selamat(r.mukaMula || '') + '" placeholder="Contoh: 12"></div>' +
      '<div class="medan"><label for="r-habis">Muka surat hafazan habis</label>' +
      '<input id="r-habis" type="number" min="1" max="604" inputmode="numeric" value="' +
      u.selamat(r.mukaHabis || '') + '" placeholder="Contoh: 14"></div>' +
      '</div>' +

      '<div class="medan"><label for="r-nota">Nota harian</label>' +
      '<textarea id="r-nota" placeholder="Catatan guru untuk tarikh ini">' +
      u.selamat(nota ? nota.teks : '') + '</textarea></div>' +

      '<div class="semak"><input type="checkbox" id="r-kongsi"' +
      (nota && nota.kongsi ? ' checked' : '') + '>' +
      '<label for="r-kongsi">Kongsi nota ini dengan jabatan</label></div>' +

      '<button class="butang butang-penuh" type="button" data-simpan>Simpan rekod</button>';

    var pilihanHadir = hadir;
    var butang = kotak.querySelectorAll('[data-hadir]');

    function segarHadir() {
      Array.prototype.forEach.call(butang, function (b) {
        var nilai = b.getAttribute('data-hadir');
        b.classList.toggle('pilih-hadir', pilihanHadir === 'hadir' && nilai === 'hadir');
        b.classList.toggle('pilih-tidak', pilihanHadir === 'tidak' && nilai === 'tidak');
      });
    }
    Array.prototype.forEach.call(butang, function (b) {
      b.addEventListener('click', function () {
        var nilai = b.getAttribute('data-hadir');
        pilihanHadir = pilihanHadir === nilai ? '' : nilai;
        segarHadir();
      });
    });
    segarHadir();

    kotak.querySelector('[data-simpan]').addEventListener('click', function () {
      var mula = kotak.querySelector('#r-mula').value.trim();
      var habis = kotak.querySelector('#r-habis').value.trim();

      if (mula && habis && +habis < +mula) {
        CT.ui.toast('Muka surat habis mesti sama atau lebih besar daripada muka surat mula.');
        return;
      }

      // Kehadiran: hanya murid ini pada tarikh ini disentuh.
      var peta = Object.assign({}, CT.store.kehadiranTarikh(tarikh));
      if (pilihanHadir) { peta[murid.id] = pilihanHadir; }
      else { delete peta[murid.id]; }
      CT.store.simpanKehadiran(tarikh, peta);

      CT.store.simpanRekodMurid(tarikh, murid.id, {
        juz: kotak.querySelector('#r-juz').value ? +kotak.querySelector('#r-juz').value : null,
        mukaMula: mula ? +mula : null,
        mukaHabis: habis ? +habis : null
      });

      var guru = CT.store.guruAktif();
      CT.store.simpanNotaHarian(tarikh, murid.id,
        kotak.querySelector('#r-nota').value,
        kotak.querySelector('#r-kongsi').checked,
        guru ? guru.id : null);

      CT.ui.tutupLapisan();
      CT.ui.toast('Rekod ' + u.tarikhRingkas(tarikh) + ' disimpan.');
      CT.app.segarSemula();
    });

    return kotak;
  }

  function kadRekod(murid) {
    var r = CT.store.rekodMurid(tarikh, murid.id) || {};
    var hadir = CT.store.kehadiranTarikh(tarikh)[murid.id] || '';
    var nota = CT.store.notaHarian(tarikh, murid.id);

    var kad = document.createElement('div');
    kad.className = 'rekod-kad';
    kad.innerHTML =
      '<div class="baris">' +
      '<span class="avatar">' + u.selamat(u.huruf(murid.nama)) + '</span>' +
      '<span class="tumbuh"><span class="murid-nama">' + u.selamat(murid.nama) + '</span><br>' +
      '<span class="kecil">' + u.selamat(murid.matrik || 'Tiada matrik') + '</span></span>' +
      labelKehadiran(hadir) +
      '</div>' +
      '<div class="rekod-medan">' +
      '<div><b>Juz</b>' + (r.juz ? 'Juz ' + r.juz : '<span class="kosong">Juz belum direkod</span>') + '</div>' +
      '<div><b>Muka surat hafazan</b>' +
      (r.mukaMula || r.mukaHabis
        ? u.selamat((r.mukaMula || '?') + ' - ' + (r.mukaHabis || '?'))
        : '<span class="kosong">Muka surat belum direkod</span>') + '</div>' +
      '</div>' +
      '<div style="margin-top:8px"><span class="kecil tebal">Nota harian</span><br>' +
      (nota
        ? '<span class="kecil">' + u.selamat(nota.teks) + '</span>' +
          (nota.kongsi ? ' <span class="lencana lencana-biru">Dikongsi</span>' : '')
        : '<span class="kecil kosong">Belum direkod</span>') +
      '</div>' +
      '<button class="butang butang-luar butang-penuh jarak-atas" type="button" data-kemaskini>' +
      'Kemas kini</button>';

    kad.querySelector('[data-kemaskini]').addEventListener('click', function () {
      CT.ui.bukaLapisan('Kemas Kini Rekod', borang(murid));
    });
    return kad;
  }

  function render(skrin, param) {
    if (param && param.tarikh && u.sahKunci(param.tarikh)) { tarikh = param.tarikh; }
    if (!tarikh) { tarikh = u.hariIni(); }

    skrin.appendChild(CT.ui.pemilihTarikh(tarikh, function (baru) {
      tarikh = baru;
      CT.app.segarSemula();
    }));

    var cuti = CT.ui.notisCuti(tarikh);
    if (cuti) { cuti.classList.add('jarak-atas'); skrin.appendChild(cuti); }

    var kePeringkat = document.createElement('button');
    kePeringkat.type = 'button';
    kePeringkat.className = 'butang butang-lembut butang-penuh jarak-atas';
    kePeringkat.textContent = 'Buka Kehadiran untuk tarikh ini';
    kePeringkat.addEventListener('click', function () {
      CT.app.pergi('kehadiran', { tarikh: tarikh });
    });
    skrin.appendChild(kePeringkat);

    var murid = CT.store.senaraiMurid();
    if (!murid.length) {
      var kosong = CT.ui.kosong('Belum ada murid',
        'Tambah murid dalam tab Murid untuk mula merekod.');
      kosong.classList.add('jarak-atas');
      skrin.appendChild(kosong);
      return;
    }

    var tajuk = document.createElement('p');
    tajuk.className = 'seksyen-tajuk jarak-atas';
    tajuk.textContent = 'Rekod ' + murid.length + ' murid';
    skrin.appendChild(tajuk);

    var senarai = document.createElement('div');
    senarai.className = 'senarai';
    murid.forEach(function (m) { senarai.appendChild(kadRekod(m)); });
    skrin.appendChild(senarai);
  }

  return { tajuk: 'Rekod', render: render };
})();

</script>

<script>
/* js/views/quran.js */
/* Tab Al-Quran — 30 juz.
   Aplikasi ini TIDAK disertakan dengan kandungan mushaf. Guru memasukkan sendiri
   fail PDF setiap juz; fail disimpan pada peranti (IndexedDB) dan boleh dibuka
   tanpa sambungan internet. */

window.CT = window.CT || {};
CT.views = CT.views || {};

CT.views.quran = (function () {
  'use strict';

  var u = CT.util;
  var adaFail = {};      // "juz-1" -> { nama, saiz }
  var dimuat = false;
  var urlPembaca = null;

  function kunciJuz(n) { return 'juz-' + n; }

  function saizMesra(bait) {
    if (!bait) { return ''; }
    if (bait < 1024) { return bait + ' bait'; }
    if (bait < 1024 * 1024) { return Math.max(1, Math.round(bait / 1024)) + ' KB'; }
    return (bait / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function muatStatus() {
    return CT.store.infoFail().then(function (semua) {
      adaFail = {};
      semua.forEach(function (f) { adaFail[f.kunci] = f; });
      dimuat = true;
    }).catch(function () { dimuat = true; });
  }

  /* ---------- Pembaca mushaf ---------- */
  function bukaMushaf(nombor) {
    CT.store.ambilFail(kunciJuz(nombor)).then(function (rekod) {
      if (!rekod || !rekod.blob) {
        CT.ui.toast('Juz ' + nombor + ' belum dimasukkan.');
        return;
      }
      if (urlPembaca) { URL.revokeObjectURL(urlPembaca); }
      urlPembaca = URL.createObjectURL(rekod.blob);

      var pembaca = document.createElement('div');
      pembaca.className = 'pembaca';
      pembaca.innerHTML =
        '<div class="pembaca-kepala">' +
        '<span class="tebal">Juz ' + nombor + '</span>' +
        '<span class="baris">' +
        '<button class="butang butang-luar butang-kecil" type="button" data-tetingkap>Tetingkap baharu</button>' +
        '<button class="butang-ikon" type="button" data-tutup aria-label="Tutup">&times;</button>' +
        '</span></div>' +
        '<iframe title="Mushaf Juz ' + nombor + '" src="' + urlPembaca + '"></iframe>';

      pembaca.querySelector('[data-tutup]').addEventListener('click', function () {
        pembaca.remove();
        if (urlPembaca) { URL.revokeObjectURL(urlPembaca); urlPembaca = null; }
      });
      pembaca.querySelector('[data-tetingkap]').addEventListener('click', function () {
        window.open(urlPembaca, '_blank');
      });
      document.body.appendChild(pembaca);
    });
  }

  function masukkanFail(nombor, fail) {
    if (!fail) { return; }
    if (fail.type && fail.type.indexOf('pdf') === -1) {
      CT.ui.toast('Sila pilih fail PDF.');
      return;
    }
    CT.store.simpanFail(kunciJuz(nombor), fail, { nama: fail.name }).then(function () {
      CT.ui.toast('Juz ' + nombor + ' disimpan untuk kegunaan luar talian.');
      return muatStatus();
    }).then(function () {
      CT.app.segarSemula();
    }).catch(function (e) {
      console.error(e);
      CT.ui.toast('Fail tidak dapat disimpan pada peranti.');
    });
  }

  function kadJuz(nombor) {
    var info = adaFail[kunciJuz(nombor)];
    var kad = document.createElement('div');
    kad.className = 'juz-kad';
    kad.innerHTML =
      '<div class="baris-antara">' +
      '<span class="juz-nombor">Juz ' + nombor + '</span>' +
      (info ? '<span class="lencana">Luar talian</span>'
        : '<span class="lencana lencana-kelabu">Belum ada</span>') +
      '</div>' +
      '<p class="kecil">' + (info
        ? u.selamat(info.nama || 'Fail PDF') + '<br>' + saizMesra(info.saiz)
        : 'PDF belum dimasukkan.') + '</p>' +
      '<button class="butang butang-kecil" type="button" data-buka' +
      (info ? '' : ' disabled') + '>Buka mushaf</button>' +
      '<label class="butang butang-luar butang-kecil" style="cursor:pointer">' +
      (info ? 'Ganti PDF' : 'Masukkan PDF') +
      '<input type="file" accept="application/pdf,.pdf" hidden></label>' +
      (info ? '<button class="butang butang-bahaya butang-kecil" type="button" data-padam>Padam fail</button>' : '');

    kad.querySelector('[data-buka]').addEventListener('click', function () {
      bukaMushaf(nombor);
    });
    kad.querySelector('input[type="file"]').addEventListener('change', function (e) {
      masukkanFail(nombor, e.target.files && e.target.files[0]);
    });
    if (info) {
      kad.querySelector('[data-padam]').addEventListener('click', function () {
        CT.ui.sahkan('Padam fail juz', 'Padam fail PDF Juz ' + nombor + ' daripada peranti ini?',
          function () {
            CT.store.padamFail(kunciJuz(nombor)).then(muatStatus).then(function () {
              CT.ui.toast('Fail Juz ' + nombor + ' dipadam.');
              CT.app.segarSemula();
            });
          }, 'Ya, padam');
      });
    }
    return kad;
  }

  function render(skrin) {
    var kepala = document.createElement('div');
    kepala.className = 'kad';
    kepala.innerHTML =
      '<p class="tebal">Mushaf Dar Al-Ma\'rifah, Syria</p>' +
      '<p class="arab">&#1583;&#1575;&#1585; &#1575;&#1604;&#1605;&#1593;&#1585;&#1601;&#1577;</p>' +
      '<p class="kecil jarak-atas">Aplikasi ini tidak disertakan dengan kandungan mushaf. ' +
      'Guru perlu memasukkan sendiri fail PDF bagi setiap juz. Setelah dimasukkan, ' +
      'fail disimpan pada peranti dan boleh dibuka tanpa internet.</p>' +
      '<p class="kecil jarak-atas">Gunakan hanya salinan yang sah. Sumber rasmi mushaf digital: ' +
      '<a href="https://qurancomplex.gov.sa/" target="_blank" rel="noopener noreferrer">' +
      'Kompleks Percetakan Al-Quran Raja Fahd (qurancomplex.gov.sa)</a>.</p>';
    skrin.appendChild(kepala);

    var jumlah = Object.keys(adaFail).filter(function (k) {
      return k.indexOf('juz-') === 0;
    }).length;

    var ringkas = document.createElement('p');
    ringkas.className = 'seksyen-tajuk jarak-atas';
    ringkas.textContent = dimuat
      ? jumlah + ' daripada 30 juz tersedia di luar talian'
      : 'Memuatkan status fail...';
    skrin.appendChild(ringkas);

    var grid = document.createElement('div');
    grid.className = 'quran-grid';
    for (var i = 1; i <= 30; i++) { grid.appendChild(kadJuz(i)); }
    skrin.appendChild(grid);

    if (!dimuat) {
      muatStatus().then(function () { CT.app.segarSemula(); });
    }
  }

  function segarStatus() { return muatStatus(); }

  return { tajuk: 'Al-Quran', render: render, segarStatus: segarStatus };
})();

</script>

<script>
/* js/views/nota.js */
/* Tab Nota — nota murid mengikut kategori.
   Nota sulit hanya kelihatan kepada guru yang menulisnya.
   Nota yang ditulis melalui tab Rekod turut muncul di sini pada tarikh
   dan murid yang betul. */

window.CT = window.CT || {};
CT.views = CT.views || {};

CT.views.nota = (function () {
  'use strict';

  var u = CT.util;
  var KATEGORI = ['umum', 'pencapaian', 'kebimbangan'];
  var LABEL = { umum: 'Umum', pencapaian: 'Pencapaian', kebimbangan: 'Kebimbangan' };
  var tapisan = 'semua';

  function namaMurid(id) {
    var m = CT.store.ambilMurid(id);
    return m ? m.nama : 'Murid dipadam';
  }

  function namaGuru(id) {
    var senarai = CT.store.senaraiPasukan();
    for (var i = 0; i < senarai.length; i++) {
      if (senarai[i].id === id) { return senarai[i].nama; }
    }
    return 'Guru';
  }

  function bolehLihat(nota, guru) {
    if (!nota.sulit) { return true; }
    return !!guru && nota.penulisId === guru.id;
  }

  function lencanaKategori(kategori) {
    var kelas = kategori === 'pencapaian' ? 'lencana'
      : kategori === 'kebimbangan' ? 'lencana lencana-merah' : 'lencana lencana-kelabu';
    return '<span class="' + kelas + '">' + u.selamat(LABEL[kategori] || 'Umum') + '</span>';
  }

  /* ---------- Borang nota ---------- */
  function borang(sedia) {
    var n = sedia || {};
    var murid = CT.store.senaraiMurid();
    var guru = CT.store.guruAktif();

    var kotak = document.createElement('div');
    if (!murid.length) {
      kotak.appendChild(CT.ui.kosong('Belum ada murid',
        'Tambah murid dalam tab Murid sebelum menulis nota.'));
      return kotak;
    }

    kotak.innerHTML =
      '<div class="medan"><label for="n-murid">Murid</label><select id="n-murid">' +
      murid.map(function (m) {
        return '<option value="' + u.selamat(m.id) + '"' +
          (n.muridId === m.id ? ' selected' : '') + '>' + u.selamat(m.nama) + '</option>';
      }).join('') + '</select></div>' +

      '<div class="medan-dua">' +
      '<div class="medan"><label for="n-kategori">Kategori</label><select id="n-kategori">' +
      KATEGORI.map(function (k) {
        return '<option value="' + k + '"' + (n.kategori === k ? ' selected' : '') + '>' +
          LABEL[k] + '</option>';
      }).join('') + '</select></div>' +
      '<div class="medan"><label for="n-tarikh">Tarikh</label>' +
      '<input id="n-tarikh" type="date" value="' + u.selamat(n.tarikh || u.hariIni()) + '"></div>' +
      '</div>' +

      '<div class="medan"><label for="n-teks">Nota</label>' +
      '<textarea id="n-teks" placeholder="Tulis nota murid di sini">' +
      u.selamat(n.teks || '') + '</textarea></div>' +

      '<div class="semak"><input type="checkbox" id="n-sulit"' + (n.sulit ? ' checked' : '') + '>' +
      '<label for="n-sulit">Tandakan sebagai sulit (hanya penulis boleh lihat)</label></div>' +
      '<div class="semak"><input type="checkbox" id="n-kongsi"' + (n.kongsi ? ' checked' : '') + '>' +
      '<label for="n-kongsi">Kongsi dengan jabatan</label></div>' +

      '<button class="butang butang-penuh" type="button" data-simpan>Simpan nota</button>' +
      (n.id ? '<button class="butang butang-bahaya butang-penuh jarak-atas" type="button" data-padam>Padam nota</button>' : '');

    var sulit = kotak.querySelector('#n-sulit');
    var kongsi = kotak.querySelector('#n-kongsi');
    sulit.addEventListener('change', function () {
      if (sulit.checked) { kongsi.checked = false; }
      kongsi.disabled = sulit.checked;
    });
    kongsi.disabled = sulit.checked;

    kotak.querySelector('[data-simpan]').addEventListener('click', function () {
      var teks = kotak.querySelector('#n-teks').value.trim();
      if (!teks) { CT.ui.toast('Sila tulis kandungan nota.'); return; }

      CT.store.simpanNota({
        id: n.id,
        dicipta: n.dicipta,
        sumber: n.sumber || 'nota',
        muridId: kotak.querySelector('#n-murid').value,
        kategori: kotak.querySelector('#n-kategori').value,
        tarikh: kotak.querySelector('#n-tarikh').value || u.hariIni(),
        teks: teks,
        sulit: sulit.checked,
        kongsi: sulit.checked ? false : kongsi.checked,
        penulisId: n.penulisId || (guru ? guru.id : null),
        dikemaskini: new Date().toISOString()
      });
      CT.ui.tutupLapisan();
      CT.ui.toast(n.id ? 'Nota dikemas kini.' : 'Nota disimpan.');
      CT.app.segarSemula();
    });

    if (n.id) {
      kotak.querySelector('[data-padam]').addEventListener('click', function () {
        CT.ui.sahkan('Padam nota', 'Padam nota ini secara kekal?', function () {
          CT.store.padamNota(n.id);
          CT.ui.toast('Nota dipadam.');
          CT.app.segarSemula();
        }, 'Ya, padam');
      });
    }
    return kotak;
  }

  function kadNota(n, guru) {
    var kad = document.createElement('div');
    kad.className = 'nota-kad';
    kad.innerHTML =
      '<div class="baris-antara">' +
      '<span class="tumbuh"><span class="tebal">' + u.selamat(namaMurid(n.muridId)) + '</span><br>' +
      '<span class="kecil">' + u.selamat(u.tarikhRingkas(n.tarikh)) + ' &middot; ' +
      u.selamat(namaGuru(n.penulisId)) + '</span></span>' +
      lencanaKategori(n.kategori) +
      '</div>' +
      '<p class="nota-teks">' + u.selamat(n.teks) + '</p>' +
      '<div class="baris-lipat jarak-atas">' +
      (n.sulit ? '<span class="lencana lencana-merah">Sulit</span>' : '') +
      (n.kongsi ? '<span class="lencana lencana-biru">Dikongsi dengan jabatan</span>' : '') +
      (n.sumber === 'rekod' ? '<span class="lencana lencana-kelabu">Daripada Rekod</span>' : '') +
      '</div>' +
      '<button class="butang butang-luar butang-kecil jarak-atas" type="button" data-sunting>Sunting</button>';

    kad.querySelector('[data-sunting]').addEventListener('click', function () {
      if (n.penulisId && guru && n.penulisId !== guru.id && n.sulit) {
        CT.ui.toast('Nota sulit hanya boleh disunting oleh penulisnya.');
        return;
      }
      CT.ui.bukaLapisan('Sunting Nota', borang(n));
    });
    return kad;
  }

  function render(skrin) {
    var guru = CT.store.guruAktif();

    var tambah = document.createElement('button');
    tambah.type = 'button';
    tambah.className = 'butang butang-penuh';
    tambah.textContent = '+ Tambah Nota';
    tambah.addEventListener('click', function () {
      CT.ui.bukaLapisan('Tambah Nota', borang(null));
    });
    skrin.appendChild(tambah);

    var tapis = document.createElement('div');
    tapis.className = 'tapis jarak-atas';
    ['semua'].concat(KATEGORI).forEach(function (k) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = k === 'semua' ? 'Semua' : LABEL[k];
      b.className = tapisan === k ? 'aktif' : '';
      b.addEventListener('click', function () {
        tapisan = k;
        CT.app.segarSemula();
      });
      tapis.appendChild(b);
    });
    skrin.appendChild(tapis);

    var semua = CT.store.senaraiNota().filter(function (n) { return bolehLihat(n, guru); });
    var ditapis = tapisan === 'semua'
      ? semua
      : semua.filter(function (n) { return (n.kategori || 'umum') === tapisan; });

    var tajuk = document.createElement('p');
    tajuk.className = 'seksyen-tajuk jarak-atas';
    tajuk.textContent = ditapis.length + ' nota' +
      (guru ? ' — dilihat sebagai ' + guru.nama : '');
    skrin.appendChild(tajuk);

    if (!ditapis.length) {
      skrin.appendChild(CT.ui.kosong('Tiada nota',
        'Nota yang anda tambah di sini atau melalui tab Rekod akan dipaparkan di sini.'));
      return;
    }

    var senarai = document.createElement('div');
    senarai.className = 'senarai';
    ditapis.forEach(function (n) { senarai.appendChild(kadNota(n, guru)); });
    skrin.appendChild(senarai);
  }

  return { tajuk: 'Nota', render: render };
})();

</script>

<script>
/* js/views/pasukan.js */
/* Tab Pasukan — kerjasama jabatan.
   Prototaip ini menyimpan senarai guru pada peranti sahaja. Struktur data
   ("id", "peranan", "akses") sudah disediakan supaya log masuk dan pangkalan
   data awan boleh ditambah kemudian tanpa mengubah antara muka. */

window.CT = window.CT || {};
CT.views = CT.views || {};

CT.views.pasukan = (function () {
  'use strict';

  var u = CT.util;
  var AKSES = ['Akses penuh', 'Boleh sunting', 'Boleh lihat'];

  function lencanaAkses(akses) {
    var kelas = akses === 'Akses penuh' ? 'lencana'
      : akses === 'Boleh sunting' ? 'lencana lencana-biru' : 'lencana lencana-kelabu';
    return '<span class="' + kelas + '">' + u.selamat(akses) + '</span>';
  }

  function borang(sedia) {
    var a = sedia || {};
    var kotak = document.createElement('div');
    kotak.innerHTML =
      '<div class="medan"><label for="p-nama">Nama guru</label>' +
      '<input id="p-nama" type="text" value="' + u.selamat(a.nama || '') +
      '" placeholder="Nama penuh guru"></div>' +
      '<div class="medan"><label for="p-peranan">Peranan</label>' +
      '<input id="p-peranan" type="text" value="' + u.selamat(a.peranan || '') +
      '" placeholder="Contoh: Guru Tahfiz"></div>' +
      '<div class="medan"><label for="p-emel">E-mel</label>' +
      '<input id="p-emel" type="email" value="' + u.selamat(a.emel || '') +
      '" placeholder="nama@uis.edu.my"></div>' +
      '<div class="medan"><label for="p-akses">Tahap akses</label><select id="p-akses">' +
      AKSES.map(function (k) {
        return '<option' + (a.akses === k ? ' selected' : '') + '>' + k + '</option>';
      }).join('') + '</select></div>' +
      '<button class="butang butang-penuh" type="button" data-simpan>' +
      (a.id ? 'Simpan perubahan' : 'Hantar jemputan') + '</button>' +
      (a.id ? '<button class="butang butang-bahaya butang-penuh jarak-atas" type="button" data-buang>Buang daripada pasukan</button>' : '');

    kotak.querySelector('[data-simpan]').addEventListener('click', function () {
      var nama = kotak.querySelector('#p-nama').value.trim();
      if (!nama) { CT.ui.toast('Sila isi nama guru.'); return; }
      CT.store.simpanAhli({
        id: a.id,
        dicipta: a.dicipta,
        nama: nama,
        peranan: kotak.querySelector('#p-peranan').value.trim() || 'Guru',
        emel: kotak.querySelector('#p-emel').value.trim(),
        akses: kotak.querySelector('#p-akses').value,
        status: a.status || (a.id ? 'aktif' : 'dijemput')
      });
      CT.ui.tutupLapisan();
      CT.ui.toast(a.id ? 'Maklumat guru dikemas kini.' : 'Jemputan direkodkan.');
      CT.app.segarSemula();
    });

    if (a.id) {
      kotak.querySelector('[data-buang]').addEventListener('click', function () {
        if (CT.store.senaraiPasukan().length <= 1) {
          CT.ui.toast('Sekurang-kurangnya seorang guru mesti kekal dalam pasukan.');
          return;
        }
        CT.ui.sahkan('Buang guru', 'Buang ' + a.nama + ' daripada pasukan jabatan?',
          function () {
            var tetapan = CT.store.tetapan();
            CT.store.padamAhli(a.id);
            if (tetapan.guruAktifId === a.id) {
              var baki = CT.store.senaraiPasukan();
              CT.store.simpanTetapan({ guruAktifId: baki.length ? baki[0].id : null });
            }
            CT.ui.toast('Guru dibuang daripada pasukan.');
            CT.app.segarSemula();
          }, 'Ya, buang');
      });
    }
    return kotak;
  }

  function render(skrin) {
    var senarai = CT.store.senaraiPasukan();
    var aktif = CT.store.guruAktif();

    /* Guru yang sedang menggunakan aplikasi (menggantikan log masuk buat sementara) */
    var kotakAktif = document.createElement('div');
    kotakAktif.className = 'kad';
    kotakAktif.innerHTML =
      '<p class="seksyen-tajuk">Guru aktif</p>' +
      '<div class="medan" style="margin-bottom:0"><select id="guru-aktif">' +
      senarai.map(function (g) {
        return '<option value="' + u.selamat(g.id) + '"' +
          (aktif && aktif.id === g.id ? ' selected' : '') + '>' +
          u.selamat(g.nama) + ' — ' + u.selamat(g.peranan || 'Guru') + '</option>';
      }).join('') + '</select></div>' +
      '<p class="kecil jarak-atas">Nota sulit yang ditulis oleh guru lain tidak dipaparkan ' +
      'kepada guru aktif. Bahagian ini akan digantikan dengan log masuk sebenar.</p>';

    kotakAktif.querySelector('#guru-aktif').addEventListener('change', function (e) {
      CT.store.simpanTetapan({ guruAktifId: e.target.value });
      CT.ui.toast('Guru aktif ditukar.');
      CT.app.segarSemula();
    });
    skrin.appendChild(kotakAktif);

    var jemput = document.createElement('button');
    jemput.type = 'button';
    jemput.className = 'butang butang-penuh jarak-atas';
    jemput.textContent = '+ Jemput Guru';
    jemput.addEventListener('click', function () {
      CT.ui.bukaLapisan('Jemput Guru', borang(null));
    });
    skrin.appendChild(jemput);

    var tajuk = document.createElement('p');
    tajuk.className = 'seksyen-tajuk jarak-atas';
    tajuk.textContent = senarai.length + ' guru dalam jabatan';
    skrin.appendChild(tajuk);

    var kotakSenarai = document.createElement('div');
    kotakSenarai.className = 'senarai';
    senarai.forEach(function (g) {
      var kad = document.createElement('div');
      kad.className = 'kad kad-rapat';
      kad.innerHTML =
        '<div class="baris">' +
        '<span class="avatar">' + u.selamat(u.huruf(g.nama)) + '</span>' +
        '<span class="tumbuh"><span class="murid-nama">' + u.selamat(g.nama) + '</span><br>' +
        '<span class="kecil">' + u.selamat(g.peranan || 'Guru') +
        (g.emel ? ' &middot; ' + u.selamat(g.emel) : '') + '</span></span>' +
        '</div>' +
        '<div class="baris-lipat jarak-atas">' + lencanaAkses(g.akses || 'Boleh lihat') +
        (g.status === 'dijemput' ? '<span class="lencana lencana-emas">Jemputan belum diterima</span>' : '') +
        '<button class="butang butang-luar butang-kecil" type="button" data-sunting>Sunting</button>' +
        '</div>';
      kad.querySelector('[data-sunting]').addEventListener('click', function () {
        CT.ui.bukaLapisan('Sunting Guru', borang(g));
      });
      kotakSenarai.appendChild(kad);
    });
    skrin.appendChild(kotakSenarai);

    var notis = document.createElement('div');
    notis.className = 'notis notis-info jarak-atas';
    notis.innerHTML = '<b>Prototaip:</b> senarai pasukan dan nota dikongsi disimpan pada ' +
      'peranti ini sahaja. Perkongsian sebenar antara guru memerlukan log masuk dan ' +
      'pangkalan data awan.';
    skrin.appendChild(notis);
  }

  return { tajuk: 'Pasukan', render: render };
})();

</script>

<script>
/* js/app.js */
/* ClassTrack — pemula aplikasi, navigasi tab dan pendaftaran service worker. */

window.CT = window.CT || {};

(function () {
  'use strict';

  var u = CT.util;
  var TAB = ['utama', 'murid', 'kehadiran', 'kalendar', 'rekod', 'quran', 'nota', 'pasukan'];
  var tabSemasa = 'utama';
  var paramSemasa = null;

  var skrin, tajukHalaman;

  /* ---------- Persediaan kali pertama ---------- */
  function siapkanData() {
    if (!CT.store.senaraiPasukan().length) {
      var guru = CT.store.simpanAhli({
        nama: 'Guru Utama',
        peranan: 'Guru Tahfiz',
        emel: '',
        akses: 'Akses penuh',
        status: 'aktif'
      });
      CT.store.simpanTetapan({ guruAktifId: guru.id });
    }
    if (!CT.store.tetapan().guruAktifId) {
      var senarai = CT.store.senaraiPasukan();
      if (senarai.length) { CT.store.simpanTetapan({ guruAktifId: senarai[0].id }); }
    }
  }

  /* ---------- Navigasi ---------- */
  function lukis(kekalkanTatal) {
    var tatal = window.scrollY;
    var papar = CT.views[tabSemasa] || CT.views.utama;

    skrin.innerHTML = '';
    tajukHalaman.textContent = papar.tajuk;
    document.querySelectorAll('.nav-butang').forEach(function (b) {
      b.classList.toggle('aktif', b.getAttribute('data-tab') === tabSemasa);
    });

    try {
      papar.render(skrin, paramSemasa);
    } catch (ralat) {
      console.error('Ralat memaparkan tab', tabSemasa, ralat);
      skrin.appendChild(CT.ui.kosong('Ralat paparan',
        'Tab ini tidak dapat dipaparkan. Sila cuba lagi.'));
    }
    paramSemasa = null;

    if (kekalkanTatal) { window.scrollTo(0, tatal); }
    else { window.scrollTo(0, 0); }
  }

  var abaiHash = false;

  function pergi(tab, param) {
    if (TAB.indexOf(tab) === -1) { tab = 'utama'; }
    tabSemasa = tab;
    paramSemasa = param || null;
    var hashBaru = '#/' + tab;
    if (location.hash !== hashBaru) {
      abaiHash = true;             // elak lukisan berganda daripada hashchange
      location.hash = hashBaru;
    }
    lukis(false);
  }

  function segarSemula() { lukis(true); }

  function daripadaHash() {
    var tab = String(location.hash || '').replace('#/', '');
    return TAB.indexOf(tab) !== -1 ? tab : 'utama';
  }

  /* ---------- Penunjuk rangkaian ---------- */
  function segarRangkaian() {
    var penunjuk = document.getElementById('penunjuk-rangkaian');
    if (!penunjuk) { return; }
    if (navigator.onLine) {
      penunjuk.textContent = 'Dalam talian';
    } else {
      penunjuk.textContent = 'Luar talian';
    }
  }

  /* ---------- Service worker ---------- */
  function daftarServiceWorker() {
    if (window.CT_SATU_FAIL) { return; }   // versi pratonton satu fail
    if (!('serviceWorker' in navigator)) { return; }
    if (location.protocol === 'file:') {
      console.info('Service worker memerlukan http/https. Buka melalui pelayan tempatan.');
      return;
    }
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('Service worker tidak didaftarkan:', e.message);
    });
  }

  function mula() {
    skrin = document.getElementById('skrin');
    tajukHalaman = document.getElementById('tajuk-halaman');

    siapkanData();

    document.querySelectorAll('.nav-butang').forEach(function (b) {
      b.addEventListener('click', function () { pergi(b.getAttribute('data-tab')); });
    });

    document.getElementById('lapisan-tutup').addEventListener('click', CT.ui.tutupLapisan);
    document.getElementById('lapisan').addEventListener('click', function (e) {
      if (e.target.id === 'lapisan') { CT.ui.tutupLapisan(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { CT.ui.tutupLapisan(); }
    });

    window.addEventListener('hashchange', function () {
      if (abaiHash) { abaiHash = false; return; }
      tabSemasa = daripadaHash();
      lukis(false);
    });
    window.addEventListener('online', segarRangkaian);
    window.addEventListener('offline', segarRangkaian);

    tabSemasa = daripadaHash();
    segarRangkaian();
    lukis(false);
    daftarServiceWorker();

    // Segerak cuti secara senyap bagi tahun semasa.
    CT.cuti.segerak(u.pecah(u.hariIni()).tahun, false);
  }

  CT.app = { pergi: pergi, segarSemula: segarSemula, TAB: TAB };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mula);
  } else {
    mula();
  }
})();

</script>
