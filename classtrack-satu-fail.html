<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ClassTrack UIS</title>

<style>
/* ClassTrack — Universiti Islam Selangor
   Reka bentuk mudah alih dahulu (mobile-first). */

:root {
  --hijau: #0b5d2a;
  --hijau-gelap: #084521;
  --hijau-muda: #e7f2ea;
  --emas: #f5b301;
  --merah: #d92b3d;
  --merah-muda: #fdecee;
  --biru: #1d5fb4;
  --biru-muda: #e9f0fb;

  --teks: #16241c;
  --teks-lembut: #5d6b63;
  --garis: #dfe6e1;
  --latar: #f4f7f5;
  --kad: #ffffff;

  --r-kecil: 10px;
  --r: 14px;
  --r-besar: 20px;
  --bayang: 0 1px 2px rgba(16, 40, 25, .06), 0 6px 18px rgba(16, 40, 25, .07);
  --nav-tinggi: 108px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--latar);
  color: var(--teks);
  font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  padding-bottom: calc(var(--nav-tinggi) + env(safe-area-inset-bottom));
}

h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.01em; }
a { color: var(--hijau); font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }

/* ---------- Tajuk utama ---------- */
.tajuk-utama {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background: linear-gradient(135deg, var(--hijau) 0%, var(--hijau-gelap) 100%);
  color: #fff;
  box-shadow: 0 2px 12px rgba(8, 69, 33, .25);
}
.tajuk-teks h1 { font-size: 1.15rem; line-height: 1.2; }
.tajuk-teks p { font-size: .8rem; opacity: .85; margin-top: 2px; }
.tajuk-status .lencana-kecil { background: rgba(255, 255, 255, .18); color: #fff; }

/* ---------- Skrin ---------- */
.skrin { padding: 16px 16px 8px; outline: none; max-width: 780px; margin: 0 auto; }
.seksyen { margin-bottom: 16px; }
.seksyen-tajuk {
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--teks-lembut);
  margin-bottom: 8px;
  font-weight: 700;
}

.kad {
  background: var(--kad);
  border: 1px solid var(--garis);
  border-radius: var(--r);
  padding: 14px;
  box-shadow: var(--bayang);
}
.kad + .kad { margin-top: 10px; }
.kad-rapat { padding: 12px; }

.baris { display: flex; align-items: center; gap: 10px; }
.baris-antara { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.baris-lipat { display: flex; flex-wrap: wrap; gap: 8px; }
.tumbuh { flex: 1 1 auto; min-width: 0; }
.kecil { font-size: .82rem; color: var(--teks-lembut); }
.tebal { font-weight: 700; }
.tengah { text-align: center; }
.jarak-atas { margin-top: 12px; }
.tersembunyi { display: none !important; }

/* ---------- Butang ---------- */
.butang {
  appearance: none;
  border: 1px solid transparent;
  background: var(--hijau);
  color: #fff;
  border-radius: var(--r-kecil);
  padding: 11px 14px;
  font-weight: 600;
  font-size: .92rem;
  cursor: pointer;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform .06s ease, background .15s ease;
}
.butang:active { transform: scale(.985); }
.butang-luar { background: #fff; color: var(--hijau); border-color: var(--garis); }
.butang-lembut { background: var(--hijau-muda); color: var(--hijau-gelap); }
.butang-bahaya { background: var(--merah-muda); color: var(--merah); }
.butang-penuh { width: 100%; }
.butang-kecil { min-height: 38px; padding: 8px 12px; font-size: .85rem; }
.butang:disabled { opacity: .5; cursor: not-allowed; }

.butang-ikon {
  appearance: none;
  border: 1px solid var(--garis);
  background: #fff;
  border-radius: 10px;
  width: 44px;
  height: 44px;
  font-size: 1.3rem;
  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--teks);
}

/* ---------- Medan borang ---------- */
.medan { margin-bottom: 12px; }
.medan label { display: block; font-size: .82rem; font-weight: 600; color: var(--teks-lembut); margin-bottom: 5px; }
.medan input, .medan select, .medan textarea {
  width: 100%;
  border: 1px solid var(--garis);
  border-radius: var(--r-kecil);
  padding: 11px 12px;
  background: #fff;
  min-height: 44px;
}
.medan textarea { min-height: 88px; resize: vertical; }
.medan input:focus, .medan select:focus, .medan textarea:focus {
  outline: 2px solid rgba(11, 93, 42, .35);
  outline-offset: 1px;
  border-color: var(--hijau);
}
.medan-dua { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Paparan tarikh/masa mengikut format Malaysia di atas medan asli peranti. */
.medan-hias { position: relative; display: block; width: 100%; }
.medan-hias input {
  position: relative;
  z-index: 2;
  opacity: 0;
  width: 100%;
  min-height: 44px;
}
.medan-papar {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--garis);
  border-radius: var(--r-kecil);
  background: #fff;
  font-weight: 600;
  pointer-events: none;
}
.medan-hias input:focus + .medan-papar {
  border-color: var(--hijau);
  box-shadow: 0 0 0 2px rgba(11, 93, 42, .25);
}
.semak { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.semak input { width: 20px; height: 20px; min-height: 20px; accent-color: var(--hijau); }
.semak label { margin: 0; font-size: .9rem; color: var(--teks); font-weight: 500; }

/* ---------- Lencana ---------- */
.lencana {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: .74rem;
  font-weight: 700;
  background: var(--hijau-muda);
  color: var(--hijau-gelap);
  white-space: nowrap;
}
.lencana-kelabu { background: #eef1ef; color: var(--teks-lembut); }
.lencana-merah { background: var(--merah-muda); color: var(--merah); }
.lencana-emas { background: #fdf3d8; color: #8a6300; }
.lencana-biru { background: var(--biru-muda); color: var(--biru); }

/* ---------- Navigasi bawah ---------- */
.nav-bawah {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 40;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, .97);
  border-top: 1px solid var(--garis);
  backdrop-filter: blur(8px);
}
.nav-butang {
  appearance: none;
  border: 0;
  background: transparent;
  border-radius: 12px;
  padding: 6px 2px;
  min-height: 46px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--teks-lembut);
  font-size: .62rem;
  font-weight: 600;
  line-height: 1.15;
  cursor: pointer;
}
.nav-butang svg {
  width: 21px; height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nav-butang.aktif { background: var(--hijau-muda); color: var(--hijau-gelap); }
.nav-butang:active { background: #eef1ef; }

@media (min-width: 620px) {
  :root { --nav-tinggi: 68px; }
  .nav-bawah {
    grid-template-columns: repeat(9, 1fr);
    max-width: 860px;
    margin: 0 auto;
    border-radius: 18px 18px 0 0;
  }
  .nav-butang { font-size: .68rem; }
}

/* ---------- Halaman Utama ---------- */
.utama-kotak {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  min-height: calc(100vh - var(--nav-tinggi) - 150px);
  text-align: center;
  padding: 10px 0 20px;
}
.logo-bingkai {
  width: 100%;
  max-width: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: #fff;
  border: 1px solid var(--garis);
  border-radius: var(--r-besar);
  box-shadow: var(--bayang);
}
.logo-uis {
  display: block;
  width: 100%;
  height: auto;
  max-height: 190px;
  object-fit: contain;
  /* Logo rasmi: paparan sahaja, tidak boleh ditekan atau diseret. */
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}
.logo-ganti {
  width: 100%;
  padding: 26px 16px;
  border: 1px dashed var(--garis);
  border-radius: var(--r-besar);
  background: #fff;
  color: var(--teks-lembut);
  font-size: .85rem;
}
.butang-besar {
  width: 100%;
  max-width: 340px;
  min-height: 76px;
  font-size: 1.18rem;
  font-weight: 800;
  border-radius: var(--r-besar);
  box-shadow: 0 8px 22px rgba(11, 93, 42, .28);
  letter-spacing: .01em;
}

/* ---------- Senarai murid ---------- */
.senarai { display: flex; flex-direction: column; gap: 10px; }
.murid-kad {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  background: var(--kad);
  border: 1px solid var(--garis);
  border-radius: var(--r);
  padding: 12px;
  box-shadow: var(--bayang);
  cursor: pointer;
}
.avatar {
  width: 42px; height: 42px;
  flex: 0 0 42px;
  border-radius: 50%;
  background: var(--hijau-muda);
  color: var(--hijau-gelap);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: .95rem;
}
.murid-nama { font-weight: 700; font-size: .98rem; }

/* ---------- Kehadiran ---------- */
.pilih-tarikh {
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  gap: 8px;
  align-items: center;
}
.pilih-tarikh input[type="date"] {
  width: 100%;
  border: 1px solid var(--garis);
  border-radius: var(--r-kecil);
  padding: 10px;
  min-height: 44px;
  background: #fff;
  text-align: center;
}
.hadir-baris {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px 12px;
  background: var(--kad);
  border: 1px solid var(--garis);
  border-radius: var(--r);
}
.hadir-atas { display: flex; align-items: center; gap: 10px; }

/* Dipaparkan hanya apabila murid ditanda tidak hadir. */
.hadir-butiran {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px dashed var(--garis);
}
.hadir-butiran input.nota-tidak-hadir {
  width: 100%;
  border: 1px solid var(--garis);
  border-radius: var(--r-kecil);
  padding: 9px 11px;
  min-height: 42px;
  background: #fff;
  font-size: .88rem;
}
.hadir-butiran input.nota-tidak-hadir:focus {
  outline: 2px solid rgba(11, 93, 42, .3);
  outline-offset: 1px;
  border-color: var(--hijau);
}
.segmen-maklum { flex-wrap: wrap; }
.segmen-maklum button { flex: 1 1 auto; }

.segmen { display: flex; gap: 6px; flex: 0 0 auto; }
.segmen button {
  appearance: none;
  border: 1px solid var(--garis);
  background: #fff;
  border-radius: 999px;
  padding: 8px 12px;
  font-size: .82rem;
  font-weight: 700;
  color: var(--teks-lembut);
  min-height: 40px;
  cursor: pointer;
}
.segmen button.pilih-hadir { background: var(--hijau); border-color: var(--hijau); color: #fff; }
.segmen button.pilih-tidak { background: var(--merah); border-color: var(--merah); color: #fff; }
.segmen button.pilih-maklum { background: var(--hijau-gelap); border-color: var(--hijau-gelap); color: #fff; }

.statistik { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat {
  background: var(--kad);
  border: 1px solid var(--garis);
  border-radius: var(--r);
  padding: 10px;
  text-align: center;
}
.stat b { display: block; font-size: 1.25rem; line-height: 1.2; }
.stat span { font-size: .74rem; color: var(--teks-lembut); }

.notis {
  border-radius: var(--r);
  padding: 11px 13px;
  font-size: .87rem;
  border: 1px solid transparent;
}
.notis-cuti { background: #fdf3d8; border-color: #f0d99a; color: #6d4e00; }
.notis-info { background: var(--biru-muda); border-color: #c9dcf5; color: #14498c; }

.bar-tindakan {
  position: sticky;
  bottom: calc(var(--nav-tinggi) + env(safe-area-inset-bottom) - 4px);
  display: flex;
  gap: 8px;
  padding: 10px 0 2px;
  background: linear-gradient(to top, var(--latar) 72%, rgba(244, 247, 245, 0));
}

/* ---------- Kalendar ---------- */
.kal-kepala { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.kal-bulan { font-weight: 800; font-size: 1.02rem; }
.kal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.kal-nama {
  text-align: center;
  font-size: .68rem;
  font-weight: 700;
  color: var(--teks-lembut);
  padding: 4px 0;
}
.kal-sel {
  position: relative;
  aspect-ratio: 1 / 1;
  border: 1px solid transparent;
  background: #fff;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--teks);
  padding: 0;
}
.kal-sel.luar { color: #c2ccc6; background: transparent; }
.kal-sel.hari-ini { border-color: var(--hijau); color: var(--hijau-gelap); font-weight: 800; }
.kal-sel.pilih { background: var(--hijau); color: #fff; }
.kal-sel.cuti:not(.pilih) { background: #fdf3d8; color: #6d4e00; }
.kal-titik { display: flex; gap: 3px; margin-top: 3px; height: 5px; }
.kal-titik i { width: 5px; height: 5px; border-radius: 50%; display: block; }
.t-rekod { background: var(--hijau); }
.t-acara { background: var(--biru); }
.t-cuti { background: var(--emas); }
.kal-sel.pilih .t-rekod, .kal-sel.pilih .t-acara, .kal-sel.pilih .t-cuti { background: #fff; }
/* Pada skrin lebar, sel kalendar tidak perlu setinggi lebarnya. */
@media (min-width: 620px) {
  .kal-sel { aspect-ratio: auto; min-height: 56px; }
}

.petunjuk { display: flex; flex-wrap: wrap; gap: 12px; font-size: .74rem; color: var(--teks-lembut); margin-top: 10px; }
.petunjuk span { display: inline-flex; align-items: center; gap: 5px; }
.petunjuk i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.acara-baris {
  display: flex;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--garis);
}
.acara-baris:last-child { border-bottom: 0; }
.acara-masa { flex: 0 0 78px; font-size: .8rem; font-weight: 700; color: var(--hijau-gelap); }

/* ---------- Rekod ---------- */
.rekod-kad { background: var(--kad); border: 1px solid var(--garis); border-radius: var(--r); padding: 12px; box-shadow: var(--bayang); }
.rekod-medan { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 10px; }
.rekod-medan div { font-size: .8rem; }
.rekod-medan div b { display: block; font-size: .72rem; color: var(--teks-lembut); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.kosong { color: var(--teks-lembut); font-style: italic; }

/* ---------- Al-Quran ---------- */
.quran-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.juz-kad {
  background: var(--kad);
  border: 1px solid var(--garis);
  border-radius: var(--r);
  padding: 12px;
  box-shadow: var(--bayang);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.juz-nombor { font-weight: 800; font-size: .95rem; }
.arab { font-family: "Traditional Arabic", "Amiri", "Scheherazade New", "Segoe UI", serif; font-size: 1.15rem; direction: rtl; }

.pembaca {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: #1a1f1c;
  display: flex;
  flex-direction: column;
}
.pembaca-kepala {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: calc(env(safe-area-inset-top) + 10px) 12px 10px;
  background: var(--hijau-gelap);
  color: #fff;
}
.pembaca iframe, .pembaca embed { flex: 1; width: 100%; border: 0; background: #fff; }

/* ---------- Nota ---------- */
.nota-kad { background: var(--kad); border: 1px solid var(--garis); border-radius: var(--r); padding: 12px; box-shadow: var(--bayang); }
.nota-teks { margin-top: 8px; white-space: pre-wrap; font-size: .92rem; }
.tapis { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.tapis button {
  appearance: none;
  border: 1px solid var(--garis);
  background: #fff;
  border-radius: 999px;
  padding: 7px 13px;
  font-size: .82rem;
  font-weight: 600;
  color: var(--teks-lembut);
  white-space: nowrap;
  min-height: 38px;
  cursor: pointer;
}
.tapis button.aktif { background: var(--hijau); border-color: var(--hijau); color: #fff; }

/* ---------- Sukatan (carta bar mendatar) ---------- */
.sk-senarai { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }
.sk-baris {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 0;
  width: 100%;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: pointer;
  color: inherit;
}
.sk-kepala { display: flex; align-items: center; gap: 8px; }
.sk-trek {
  display: flex;
  gap: 2px;                   /* pemisah nipis antara segmen */
  height: 18px;
  overflow: hidden;
  background: transparent;
}
.sk-sudah { flex: 0 0 auto; background: var(--hijau); }
.sk-baki { flex: 1 1 0; min-width: 0; background: #c6d3cb; }
.sk-trek > :first-child { border-radius: 4px 0 0 4px; }
.sk-trek > :last-child { border-radius: 0 4px 4px 0; }
.sk-trek > :only-child { border-radius: 4px; }
.sk-angka {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 4px 12px;
  font-size: .8rem;
  color: var(--teks-lembut);
  font-variant-numeric: tabular-nums;
}
.sk-angka b { color: var(--teks); font-size: .92rem; }
.sk-petunjuk { display: flex; flex-wrap: wrap; gap: 14px; font-size: .75rem; color: var(--teks-lembut); }
.sk-petunjuk span { display: inline-flex; align-items: center; gap: 6px; }
.sk-petunjuk i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.sk-warna-sudah { background: var(--hijau); }
.sk-warna-baki { background: #c6d3cb; }
.sk-skala {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  border-top: 1px solid var(--garis);
  padding-top: 6px;
  margin-top: 14px;
  font-variant-numeric: tabular-nums;
}

.jadual-kotak { overflow-x: auto; }
table.jadual { width: 100%; border-collapse: collapse; font-size: .82rem; }
table.jadual th, table.jadual td { padding: 8px 6px; border-bottom: 1px solid var(--garis); text-align: left; }
table.jadual th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--teks-lembut); }
table.jadual td.angka, table.jadual th.angka { text-align: right; font-variant-numeric: tabular-nums; }
table.jadual tr:last-child td { border-bottom: 0; }

/* ---------- Lapisan (modal) ---------- */
.lapisan {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: rgba(12, 26, 18, .5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.lapisan-kotak {
  background: var(--latar);
  width: 100%;
  max-width: 620px;
  max-height: 92vh;
  border-radius: var(--r-besar) var(--r-besar) 0 0;
  display: flex;
  flex-direction: column;
  animation: naik .18s ease-out;
}

.lapisan-kepala {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--garis);

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--nav-tinggi) + env(safe-area-inset-bottom) + 12px);
  z-index: 80;
  background: #16241c;
  color: #fff;
  padding: 11px 16px;
  border-radius: 999px;
  font-size: .87rem;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
  max-width: 88vw;
  text-align: center;
}

/* ---------- Keadaan kosong ---------- */
.kosong-kotak {
  text-align: center;
  padding: 28px 16px;
  background: var(--kad);
  border: 1px dashed var(--garis);
  border-radius: var(--r);
  color: var(--teks-lembut);
}
.kosong-kotak b { display: block; color: var(--teks); margin-bottom: 6px; }

<script>
/* js/util.js */
/* ClassTrack — fungsi bantuan tarikh, masa dan format Malaysia.
   Semua pengiraan tarikh menggunakan zon waktu Asia/Kuala_Lumpur. */

window.CT = window.CT || {};

(function () {
  'use strict';

  var ZON = 'Asia/Kuala_Lumpur';

  var BULAN = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun',
    'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
  var BULAN_PENDEK = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun',
    'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];
  var HARI = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
  var HARI_PENDEK = ['Ah', 'Is', 'Se', 'Ra', 'Kh', 'Ju', 'Sa'];

  // en-CA menghasilkan format YYYY-MM-DD.
  var fmtKunci = new Intl.DateTimeFormat('en-CA', {
    timeZone: ZON, year: 'numeric', month: '2-digit', day: '2-digit'
  });
  var fmtJam = new Intl.DateTimeFormat('en-US', {
    timeZone: ZON, hour: 'numeric', minute: '2-digit', hour12: true
  });

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /* Kunci tarikh "YYYY-MM-DD" mengikut waktu Malaysia. */
  function kunciDari(d) {
    return fmtKunci.format(d || new Date());
  }

  function hariIni() { return kunciDari(new Date()); }

  /* Pecahkan kunci kepada nombor tahun, bulan (1-12) dan hari. */
  function pecah(kunci) {
    var b = String(kunci || '').split('-');
    return { tahun: +b[0], bulan: +b[1], hari: +b[2] };
  }

  function bina(tahun, bulan, hari) {
    return tahun + '-' + pad(bulan) + '-' + pad(hari);
  }

  /* Guna UTC supaya penambahan hari tidak terjejas oleh zon waktu pelayar. */
  function tarikhUTC(kunci) {
    var p = pecah(kunci);
    return new Date(Date.UTC(p.tahun, p.bulan - 1, p.hari));
  }

  function tambahHari(kunci, jumlah) {
    var d = tarikhUTC(kunci);
    d.setUTCDate(d.getUTCDate() + jumlah);
    return bina(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
  }

  function hariMinggu(kunci) { return tarikhUTC(kunci).getUTCDay(); }

  function sahKunci(kunci) {
    return /^\d{4}-\d{2}-\d{2}$/.test(String(kunci || ''));
  }

  /* "Rabu, 26 Ogos 2026" */
  function tarikhPenuh(kunci) {
    if (!sahKunci(kunci)) { return '-'; }
    var p = pecah(kunci);
    return HARI[hariMinggu(kunci)] + ', ' + p.hari + ' ' + BULAN[p.bulan - 1] + ' ' + p.tahun;
  }

  /* "26/08/2026" — format tarikh Malaysia */
  function tarikhRingkas(kunci) {
    if (!sahKunci(kunci)) { return '-'; }
    var p = pecah(kunci);
    return pad(p.hari) + '/' + pad(p.bulan) + '/' + p.tahun;
  }

  /* "26 Ogo 2026" */
  function tarikhSederhana(kunci) {
    if (!sahKunci(kunci)) { return '-'; }
    var p = pecah(kunci);
    return p.hari + ' ' + BULAN_PENDEK[p.bulan - 1] + ' ' + p.tahun;
  }

  function namaBulan(bulan) { return BULAN[bulan - 1] || ''; }

  /* "14:05" -> "2:05 PM" */
  function masa12(hhmm) {
    var b = String(hhmm || '').split(':');
    var jam = parseInt(b[0], 10);
    var minit = parseInt(b[1], 10);
    if (isNaN(jam) || isNaN(minit)) { return ''; }
    var tanda = jam >= 12 ? 'PM' : 'AM';
    var j12 = jam % 12;
    if (j12 === 0) { j12 = 12; }
    return j12 + ':' + pad(minit) + ' ' + tanda;
  }

  /* Masa semasa di Malaysia dalam format 12 jam, cth "3:42 PM". */
  function masaSekarang() {
    return fmtJam.format(new Date()).replace(/[\u202f\u00a0]/g, ' ');
  }

  function capMasa(iso) {
    if (!iso) { return ''; }
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return ''; }
    return tarikhRingkas(kunciDari(d)) + ', ' + fmtJam.format(d).replace(/[\u202f\u00a0]/g, ' ');
  }

  function id(awalan) {
    return (awalan || 'id') + '-' + Date.now().toString(36) + '-' +
      Math.random().toString(36).slice(2, 8);
  }

  function selamat(teks) {
    return String(teks === null || teks === undefined ? '' : teks)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function huruf(nama) {
    var b = String(nama || '').trim().split(/\s+/);
    if (!b[0]) { return '?'; }
    if (b.length === 1) { return b[0].slice(0, 2).toUpperCase(); }
    return (b[0][0] + b[1][0]).toUpperCase();
  }

  function peratus(atas, bawah) {
    if (!bawah) { return 0; }
    return Math.round((atas / bawah) * 100);
  }

  CT.util = {
    ZON: ZON,
    BULAN: BULAN,
    HARI: HARI,
    HARI_PENDEK: HARI_PENDEK,
    pad: pad,
    kunciDari: kunciDari,
    hariIni: hariIni,
    pecah: pecah,
    bina: bina,
    tambahHari: tambahHari,
    hariMinggu: hariMinggu,
    sahKunci: sahKunci,
    tarikhPenuh: tarikhPenuh,
    tarikhRingkas: tarikhRingkas,
    tarikhSederhana: tarikhSederhana,
    namaBulan: namaBulan,
    masa12: masa12,
    masaSekarang: masaSekarang,
    capMasa: capMasa,
    id: id,
    selamat: selamat,
    huruf: huruf,
    peratus: peratus
  };
})();

<script>
/* js/store.js */
/* ClassTrack — penyimpanan data.
   Data teks : localStorage (murid, kehadiran, rekod, nota, acara, pasukan, tetapan).
   Fail besar: IndexedDB (PDF juz Al-Quran dan logo rasmi).
   Rekod kehadiran dan rekod murid menggunakan tarikh "YYYY-MM-DD" sebagai kunci. */

window.CT = window.CT || {};

(function () {
  'use strict';

  var AWALAN = 'classtrack.v1.';
  var pendengar = {};

  /* ---------- Pub/sub ringkas supaya semua tab sentiasa terkini ---------- */
  function dengar(peristiwa, fungsi) {
    (pendengar[peristiwa] = pendengar[peristiwa] || []).push(fungsi);
  }
  function lapor(peristiwa, data) {
    (pendengar[peristiwa] || []).forEach(function (f) {
      try { f(data); } catch (e) { console.error(e); }
    });
    (pendengar['*'] || []).forEach(function (f) {
      try { f(peristiwa, data); } catch (e) { console.error(e); }
    });
  }

  /* ---------- localStorage ---------- */
  function baca(kunci, ganti) {
    try {
      var mentah = localStorage.getItem(AWALAN + kunci);
      if (mentah === null) { return ganti; }
      return JSON.parse(mentah);
    } catch (e) {
      console.warn('Gagal membaca', kunci, e);
      return ganti;
    }
  }

  function tulis(kunci, nilai) {
    try {
      localStorage.setItem(AWALAN + kunci, JSON.stringify(nilai));
      return true;
    } catch (e) {
      console.error('Gagal menyimpan', kunci, e);
      CT.ui && CT.ui.toast('Ruang simpanan penuh. Data tidak dapat disimpan.');
      return false;
    }
  }

  /* ---------- Murid ---------- */
  function senaraiMurid() {
    var senarai = baca('murid', []);
    return senarai.slice().sort(function (a, b) {
      return String(a.nama || '').localeCompare(String(b.nama || ''), 'ms');
    });
  }

  function ambilMurid(id) {
    var senarai = baca('murid', []);
    for (var i = 0; i < senarai.length; i++) {
      if (senarai[i].id === id) { return senarai[i]; }
    }
    return null;
  }

  function simpanMurid(murid) {
    var senarai = baca('murid', []);
    var jumpa = false;
    for (var i = 0; i < senarai.length; i++) {
      if (senarai[i].id === murid.id) { senarai[i] = murid; jumpa = true; break; }
    }
    if (!jumpa) {
      murid.id = murid.id || CT.util.id('murid');
      murid.dicipta = murid.dicipta || new Date().toISOString();
      senarai.push(murid);
    }
    tulis('murid', senarai);
    lapor('murid');
    return murid;
  }

  function padamMurid(id) {
    tulis('murid', baca('murid', []).filter(function (m) { return m.id !== id; }));

    // Buang juga rekod berkaitan supaya tiada data yatim.
    var kehadiran = baca('kehadiran', {});
    Object.keys(kehadiran).forEach(function (t) { delete kehadiran[t][id]; });
    tulis('kehadiran', kehadiran);

    var butiran = baca('hadirButiran', {});
    Object.keys(butiran).forEach(function (t) { delete butiran[t][id]; });
    tulis('hadirButiran', butiran);

    var rekod = baca('rekod', {});
    Object.keys(rekod).forEach(function (t) { delete rekod[t][id]; });
    tulis('rekod', rekod);

    tulis('nota', baca('nota', []).filter(function (n) { return n.muridId !== id; }));

    lapor('murid');
    lapor('kehadiran');
    lapor('rekod');
    lapor('nota');
  }

  /* ---------- Kehadiran (kunci: tarikh) ---------- */
  function kehadiranTarikh(tarikh) {
    var semua = baca('kehadiran', {});
    return semua[tarikh] || {};
  }

  function simpanKehadiran(tarikh, peta) {
    var semua = baca('kehadiran', {});
    semua[tarikh] = peta;               // hanya tarikh ini disentuh
    tulis('kehadiran', semua);
    lapor('kehadiran', tarikh);
  }

  function tarikhAdaKehadiran() {
    return Object.keys(baca('kehadiran', {}));
  }

  /* Butiran tambahan bagi murid yang tidak hadir: sama ada ketidakhadiran
     itu dimaklumkan, dan nota ringkas guru. Disimpan berasingan daripada
     status hadir/tidak supaya rekod lama kekal sah. */
  function butiranKehadiran(tarikh) {
    var semua = baca('hadirButiran', {});
    return semua[tarikh] || {};
  }

  function butiranMurid(tarikh, muridId) {
    return butiranKehadiran(tarikh)[muridId] || null;
  }

  function simpanButiranKehadiran(tarikh, peta) {
    var semua = baca('hadirButiran', {});
    if (peta && Object.keys(peta).length) { semua[tarikh] = peta; }
    else { delete semua[tarikh]; }
    tulis('hadirButiran', semua);
    lapor('kehadiran', tarikh);
  }

  function simpanButiranMurid(tarikh, muridId, butiran) {
    var peta = Object.assign({}, butiranKehadiran(tarikh));
    if (butiran) { peta[muridId] = butiran; }
    else { delete peta[muridId]; }
    simpanButiranKehadiran(tarikh, peta);
  }

  /* ---------- Rekod murid mengikut tarikh ---------- */
  function rekodTarikh(tarikh) {
    var semua = baca('rekod', {});
    return semua[tarikh] || {};
  }

  function rekodMurid(tarikh, muridId) {
    return rekodTarikh(tarikh)[muridId] || null;
  }

  function simpanRekodMurid(tarikh, muridId, data) {
    var semua = baca('rekod', {});
    if (!semua[tarikh]) { semua[tarikh] = {}; }
    semua[tarikh][muridId] = Object.assign({}, semua[tarikh][muridId], data, {
      dikemaskini: new Date().toISOString()
    });
    tulis('rekod', semua);
    lapor('rekod', tarikh);
  }

  function tarikhAdaRekod() {
    var set = {};
    Object.keys(baca('kehadiran', {})).forEach(function (t) { set[t] = true; });
    var rekod = baca('rekod', {});
    Object.keys(rekod).forEach(function (t) {
      if (Object.keys(rekod[t] || {}).length) { set[t] = true; }
    });
    return Object.keys(set);
  }

  /* ---------- Nota ---------- */
  function senaraiNota() {
    return baca('nota', []).slice().sort(function (a, b) {
      return String(b.tarikh || '').localeCompare(String(a.tarikh || '')) ||
        String(b.dicipta || '').localeCompare(String(a.dicipta || ''));
    });
  }

  function simpanNota(nota) {
    var senarai = baca('nota', []);
    var jumpa = false;
    for (var i = 0; i < senarai.length; i++) {
      if (senarai[i].id === nota.id) { senarai[i] = nota; jumpa = true; break; }
    }
    if (!jumpa) {
      nota.id = nota.id || CT.util.id('nota');
      nota.dicipta = nota.dicipta || new Date().toISOString();
      senarai.push(nota);
    }
    tulis('nota', senarai);
    lapor('nota');
    return nota;
  }

  /* Nota harian daripada tab Rekod: satu nota bagi setiap murid + tarikh. */
  function notaHarian(tarikh, muridId) {
    var senarai = baca('nota', []);
    for (var i = 0; i < senarai.length; i++) {
      if (senarai[i].sumber === 'rekod' && senarai[i].tarikh === tarikh &&
        senarai[i].muridId === muridId) { return senarai[i]; }
    }
    return null;
  }

  function simpanNotaHarian(tarikh, muridId, teks, kongsi, penulisId) {
    var sedia = notaHarian(tarikh, muridId);
    var bersih = String(teks || '').trim();

    if (!bersih) {
      if (sedia) { padamNota(sedia.id); }
      return null;
    }
    var nota = sedia || {
      id: CT.util.id('nota'),
      sumber: 'rekod',
      tarikh: tarikh,
      muridId: muridId,
      kategori: 'umum',
      sulit: false,
      dicipta: new Date().toISOString()
    };
    nota.teks = bersih;
    nota.kongsi = !!kongsi;
    nota.penulisId = nota.penulisId || penulisId;
    nota.dikemaskini = new Date().toISOString();
    return simpanNota(nota);
  }

  function padamNota(id) {
    tulis('nota', baca('nota', []).filter(function (n) { return n.id !== id; }));
    lapor('nota');
  }

  /* ---------- Acara kalendar ---------- */
  function acaraTarikh(tarikh) {
    var semua = baca('acara', {});
    return (semua[tarikh] || []).slice().sort(function (a, b) {
      return String(a.masa || '').localeCompare(String(b.masa || ''));
    });
  }

  function simpanAcara(tarikh, acara) {
    var semua = baca('acara', {});
    if (!semua[tarikh]) { semua[tarikh] = []; }
    acara.id = acara.id || CT.util.id('acara');
    var jumpa = false;
    for (var i = 0; i < semua[tarikh].length; i++) {
      if (semua[tarikh][i].id === acara.id) { semua[tarikh][i] = acara; jumpa = true; break; }
    }
    if (!jumpa) { semua[tarikh].push(acara); }
    tulis('acara', semua);
    lapor('acara', tarikh);
  }

  function padamAcara(tarikh, id) {
    var semua = baca('acara', {});
    semua[tarikh] = (semua[tarikh] || []).filter(function (a) { return a.id !== id; });
    if (!semua[tarikh].length) { delete semua[tarikh]; }
    tulis('acara', semua);
    lapor('acara', tarikh);
  }

  function tarikhAdaAcara() { return Object.keys(baca('acara', {})); }

  /* ---------- Pasukan / jabatan ---------- */
  function senaraiPasukan() { return baca('pasukan', []); }

  function simpanAhli(ahli) {
    var senarai = baca('pasukan', []);
    var jumpa = false;
    for (var i = 0; i < senarai.length; i++) {
      if (senarai[i].id === ahli.id) { senarai[i] = ahli; jumpa = true; break; }
    }
    if (!jumpa) {
      ahli.id = ahli.id || CT.util.id('guru');
      ahli.dicipta = ahli.dicipta || new Date().toISOString();
      senarai.push(ahli);
    }
    tulis('pasukan', senarai);
    lapor('pasukan');
    return ahli;
  }

  function padamAhli(id) {
    tulis('pasukan', baca('pasukan', []).filter(function (a) { return a.id !== id; }));
    lapor('pasukan');
  }

  function tetapan() {
    return baca('tetapan', {});
  }

  function simpanTetapan(ubah) {
    var t = Object.assign({}, tetapan(), ubah);
    tulis('tetapan', t);
    lapor('tetapan');
    return t;
  }

  function guruAktif() {
    var senarai = senaraiPasukan();
    var t = tetapan();
    for (var i = 0; i < senarai.length; i++) {
      if (senarai[i].id === t.guruAktifId) { return senarai[i]; }
    }
    return senarai[0] || null;
  }

  /* ---------- IndexedDB untuk fail ---------- */
  var DB_NAMA = 'classtrack-fail';
  var DB_KEDAI = 'fail';
  var dbJanji = null;

  function db() {
    if (dbJanji) { return dbJanji; }
    dbJanji = new Promise(function (terima, tolak) {
      if (!window.indexedDB) { tolak(new Error('IndexedDB tidak disokong')); return; }
      var permintaan = indexedDB.open(DB_NAMA, 1);
      permintaan.onupgradeneeded = function () {
        var pangkalan = permintaan.result;
        if (!pangkalan.objectStoreNames.contains(DB_KEDAI)) {
          pangkalan.createObjectStore(DB_KEDAI, { keyPath: 'kunci' });
        }
      };
      permintaan.onsuccess = function () { terima(permintaan.result); };
      permintaan.onerror = function () { tolak(permintaan.error); };
    });
    return dbJanji;
  }

  function urusNiaga(mod, kerja) {
    return db().then(function (pangkalan) {
      return new Promise(function (terima, tolak) {
        var tx = pangkalan.transaction(DB_KEDAI, mod);
        var kedai = tx.objectStore(DB_KEDAI);
        var hasil;
        try { hasil = kerja(kedai); } catch (e) { tolak(e); return; }
        tx.oncomplete = function () {
          terima(hasil && hasil.result !== undefined ? hasil.result : hasil);
        };
        tx.onerror = function () { tolak(tx.error); };
        tx.onabort = function () { tolak(tx.error); };
      });
    });
  }

  function simpanFail(kunci, blob, meta) {
    return urusNiaga('readwrite', function (kedai) {
      return kedai.put({
        kunci: kunci,
        blob: blob,
        nama: (meta && meta.nama) || '',
        saiz: blob.size,
        jenis: blob.type || 'application/pdf',
        disimpan: new Date().toISOString()
      });
    }).then(function () { lapor('fail', kunci); });
  }

  function ambilFail(kunci) {
    return urusNiaga('readonly', function (kedai) { return kedai.get(kunci); });
  }

  function padamFail(kunci) {
    return urusNiaga('readwrite', function (kedai) { return kedai.delete(kunci); })
      .then(function () { lapor('fail', kunci); });
  }

  function senaraiFail() {
    return urusNiaga('readonly', function (kedai) { return kedai.getAllKeys(); })
      .then(function (kunci) { return kunci || []; });
  }

  function infoFail() {
    return urusNiaga('readonly', function (kedai) { return kedai.getAll(); })
      .then(function (semua) {
        return (semua || []).map(function (f) {
          return { kunci: f.kunci, nama: f.nama, saiz: f.saiz, disimpan: f.disimpan };
        });
      });
  }

  CT.store = {
    dengar: dengar,
    lapor: lapor,
    baca: baca,
    tulis: tulis,

    senaraiMurid: senaraiMurid,
    ambilMurid: ambilMurid,
    simpanMurid: simpanMurid,
    padamMurid: padamMurid,

    kehadiranTarikh: kehadiranTarikh,
    simpanKehadiran: simpanKehadiran,
    tarikhAdaKehadiran: tarikhAdaKehadiran,
    butiranKehadiran: butiranKehadiran,
    butiranMurid: butiranMurid,
    simpanButiranKehadiran: simpanButiranKehadiran,
    simpanButiranMurid: simpanButiranMurid,

    rekodTarikh: rekodTarikh,
    rekodMurid: rekodMurid,
    simpanRekodMurid: simpanRekodMurid,
    tarikhAdaRekod: tarikhAdaRekod,

    senaraiNota: senaraiNota,
    simpanNota: simpanNota,
    padamNota: padamNota,
    notaHarian: notaHarian,
    simpanNotaHarian: simpanNotaHarian,

    acaraTarikh: acaraTarikh,
    simpanAcara: simpanAcara,
    padamAcara: padamAcara,
    tarikhAdaAcara: tarikhAdaAcara,

    senaraiPasukan: senaraiPasukan,
    simpanAhli: simpanAhli,
    padamAhli: padamAhli,
    guruAktif: guruAktif,

    tetapan: tetapan,
    simpanTetapan: simpanTetapan,

    simpanFail: simpanFail,
    ambilFail: ambilFail,
    padamFail: padamFail,
    senaraiFail: senaraiFail,
    infoFail: infoFail
  };
})();

</script>

<script>

  var cacheMemori = {};   // tahun -> { peta, sumber, masa }

  function daripadaSandaran(tahun) {

      return { tarikh: b[0], nama: b[1], anggaran: !!b[2] };

  function kunciCache(tahun) { return 'cuti.' + tahun; }

  function bacaCache(tahun) {

  }

  function tulisCache(tahun, senarai) {
    CT.store.tulis(kunciCache(tahun), {
      tahun: tahun,
      senarai: senarai,
      disegerak: new Date().toISOString()
    });
  }

  function petakan(senarai) {
    var peta = {};
    senarai.forEach(function (c) {
      if (!peta[c.tarikh]) { peta[c.tarikh] = []; }
      var ulang = peta[c.tarikh].some(function (a) { return a.nama === c.nama; });
      if (!ulang) { peta[c.tarikh].push(c); }

    return peta;
  }

  /* Kembalikan data segera (cache atau sandaran) tanpa menunggu rangkaian. */
  function tahunSegera(tahun) {
    if (cacheMemori[tahun]) { return cacheMemori[tahun]; }

    var simpan = bacaCache(tahun);
    var hasil;
    if (simpan && simpan.senarai && simpan.senarai.length) {
      hasil = { peta: petakan(simpan.senarai), sumber: 'segerak', masa: simpan.disegerak };
    } else {
      hasil = { peta: petakan(daripadaSandaran(tahun)), sumber: 'sandaran', masa: null };
    }
    cacheMemori[tahun] = hasil;
    return hasil;
  }

  function cutiPada(tarikh) {
    if (!CT.util.sahKunci(tarikh)) { return []; }
    var tahun = CT.util.pecah(tarikh).tahun;
    return tahunSegera(tahun).peta[tarikh] || [];
  }

  function adaCuti(tarikh) { return cutiPada(tarikh).length > 0; }

  function statusSegerak(tahun) {
    var d = tahunSegera(tahun);
    return { sumber: d.sumber, masa: d.masa };
  }

  /* Penyegerakan langsung. Jika gagal, data luar talian terus digunakan. */
  function segerak(tahun, paksa) {
    var simpan = bacaCache(tahun);
    if (!paksa && simpan && simpan.disegerak) {
      var umur = Date.now() - new Date(simpan.disegerak).getTime();
      if (umur < 7 * 24 * 60 * 60 * 1000) {
        return Promise.resolve({ status: 'cache', bilangan: simpan.senarai.length });
      }
    }
    if (!navigator.onLine) {
      return Promise.resolve({ status: 'luar-talian', bilangan: 0 });
    }

    var url = 'https://date.nager.at/api/v3/PublicHolidays/' + tahun + '/MY';
    var pembatal = new AbortController();
    var masaTamat = setTimeout(function () { pembatal.abort(); }, 12000);

    return fetch(url, { signal: pembatal.signal, cache: 'no-store' })
      .then(function (jawapan) {
        if (!jawapan.ok) { throw new Error('HTTP ' + jawapan.status); }
        return jawapan.json();
      })
      .then(function (data) {
        clearTimeout(masaTamat);
        if (!Array.isArray(data) || !data.length) { throw new Error('Data kosong'); }

        var ditapis = data.filter(function (c) {
          if (c.global || !c.counties || !c.counties.length) { return true; }
          return c.counties.indexOf(WILAYAH.KL) !== -1 ||
            c.counties.indexOf(WILAYAH.SELANGOR) !== -1;
        }).map(function (c) {
          return { tarikh: c.date, nama: c.localName || c.name, anggaran: false };
        });

        if (!ditapis.length) { throw new Error('Tiada cuti berkaitan'); }

        tulisCache(tahun, ditapis);
        cacheMemori[tahun] = {
          peta: petakan(ditapis), sumber: 'segerak', masa: new Date().toISOString()
        };
        CT.store.lapor('cuti', tahun);
        return { status: 'ok', bilangan: ditapis.length };
      })
      .catch(function (ralat) {
        clearTimeout(masaTamat);
        console.warn('Penyegerakan cuti gagal:', ralat.message);
        return { status: 'gagal', ralat: ralat.message, bilangan: 0 };
      });
  }

  CT.cuti = {
    cutiPada: cutiPada,
    adaCuti: adaCuti,
    tahunSegera: tahunSegera,
    statusSegerak: statusSegerak,
    segerak: segerak
  };
})();

</script>

<script>
/* js/sukatan.js */
/* ClassTrack — sukatan hafazan mengikut program dan tahap.

   Muka surat mengikut susun atur mushaf 604 halaman (Madani / Dar Al-Ma'rifah).
   Nombor halaman yang direkodkan guru dalam tab Rekod ialah nombor halaman
   MUTLAK dalam mushaf (1-604), bukan halaman dalam juz. */

window.CT = window.CT || {};

(function () {
  'use strict';

  var JUMLAH_HALAMAN = 604;

  /* Halaman pertama bagi setiap juz. */
  var JUZ_MULA = {
    1: 1, 2: 22, 3: 42, 4: 62, 5: 82, 6: 102, 7: 121, 8: 142, 9: 162, 10: 182,
    11: 201, 12: 222, 13: 242, 14: 262, 15: 282, 16: 302, 17: 322, 18: 342,
    19: 362, 20: 382, 21: 402, 22: 422, 23: 442, 24: 462, 25: 482, 26: 502,
    27: 522, 28: 542, 29: 562, 30: 582
  };

  var PROGRAM = {
    diploma: {
      nama: 'Diploma',
      label: 'Hifz',
      tahap: {
        1: [1, 4], 2: [5, 9], 3: [10, 14], 4: [15, 20], 5: [21, 25], 6: [26, 30]
      }
    },
    ijazah: {
      nama: 'Ijazah',
      label: "I'adah",
      tahap: {
        1: [1, 4], 2: [5, 8], 3: [9, 12], 4: [13, 16],
        5: [17, 20], 6: [21, 24], 7: [25, 26], 8: [27, 30]
      }
    }
  };

  var TARIKH_AKHIR_LALAI = '2026-09-25';

  function program(kunci) {
    return PROGRAM[kunci] || PROGRAM.diploma;
  }

  function namaTahap(kunciProgram, tahap) {
    return program(kunciProgram).label + ' ' + tahap;
  }

  /* Julat juz bagi tahap tertentu, atau null jika tahap itu tiada sukatan. */
  function julatJuz(kunciProgram, tahap) {
    var julat = program(kunciProgram).tahap[tahap];
    if (!julat) { return null; }
    return { mula: julat[0], habis: julat[1] };
  }

  /* Julat halaman mutlak bagi tahap tertentu. */
  function julatHalaman(kunciProgram, tahap) {
    var juz = julatJuz(kunciProgram, tahap);
    if (!juz) { return null; }
    var mula = JUZ_MULA[juz.mula];
    var habis = juz.habis >= 30 ? JUMLAH_HALAMAN : JUZ_MULA[juz.habis + 1] - 1;
    return {
      juzMula: juz.mula,
      juzHabis: juz.habis,
      mula: mula,
      habis: habis,
      jumlah: habis - mula + 1
    };
  }

  /* Halaman terjauh yang pernah dihantar murid, berserta tarikh rekod pertama. */
  function rekodHafazan(muridId) {
    var semua = CT.store.baca('rekod', {});
    var terjauh = 0;
    var tarikhTerjauh = null;
    var tarikhPertama = null;
    var bilanganHari = 0;

    Object.keys(semua).forEach(function (tarikh) {
      var r = semua[tarikh][muridId];
      if (!r) { return; }
      var halaman = Math.max(+r.mukaHabis || 0, +r.mukaMula || 0);
      if (!halaman) { return; }

      bilanganHari++;
      if (!tarikhPertama || tarikh < tarikhPertama) { tarikhPertama = tarikh; }
      if (halaman > terjauh) { terjauh = halaman; tarikhTerjauh = tarikh; }
    });

    return {
      halaman: terjauh,
      tarikh: tarikhTerjauh,
      tarikhPertama: tarikhPertama,
      bilanganHari: bilanganHari
    };
  }

  /* Rekod hafazan terakhir SEBELUM tarikh yang diberi.
     Digunakan untuk menyambung muka surat: jika kali terakhir murid habis di
     halaman 487, rekod berikutnya bermula di halaman 488. */
  function rekodTerakhirSebelum(muridId, tarikh) {
    var semua = CT.store.baca('rekod', {});
    var terkini = null;

    Object.keys(semua).forEach(function (t) {
      if (t >= tarikh) { return; }          // kunci "YYYY-MM-DD" boleh dibanding terus
      var r = semua[t][muridId];
      if (!r) { return; }
      var halaman = Math.max(+r.mukaHabis || 0, +r.mukaMula || 0);
      if (!halaman) { return; }
      if (!terkini || t > terkini.tarikh) {
        terkini = { tarikh: t, halaman: halaman, juz: r.juz || null };
      }
    });

    return terkini;
  }

  /* Juz bagi sesuatu nombor halaman mushaf. */
  function juzUntukHalaman(halaman) {
    var n = +halaman;
    if (!n || n < 1 || n > JUMLAH_HALAMAN) { return null; }
    for (var juz = 30; juz >= 1; juz--) {
      if (n >= JUZ_MULA[juz]) { return juz; }
    }
    return null;
  }

  /* Cadangan permulaan bagi rekod baharu pada tarikh tertentu. */
  function cadanganSambungan(muridId, tarikh) {
    var lepas = rekodTerakhirSebelum(muridId, tarikh);
    if (!lepas || lepas.halaman >= JUMLAH_HALAMAN) { return null; }
    var mula = lepas.halaman + 1;
    return {
      mula: mula,
      juz: juzUntukHalaman(mula),
      dariHalaman: lepas.halaman,
      dariTarikh: lepas.tarikh
    };
  }

  function bezaHari(dari, hingga) {
    if (!CT.util.sahKunci(dari) || !CT.util.sahKunci(hingga)) { return 0; }
    var a = CT.util.pecah(dari);
    var b = CT.util.pecah(hingga);
    var ms = Date.UTC(b.tahun, b.bulan - 1, b.hari) - Date.UTC(a.tahun, a.bulan - 1, a.hari);
    return Math.round(ms / 86400000);
  }

  function tarikhAkhir() {
    return CT.store.tetapan().tarikhAkhirSemester || TARIKH_AKHIR_LALAI;
  }

  /* Kiraan penuh sukatan bagi seorang murid. */
  function kira(murid, hariIni) {
    hariIni = hariIni || CT.util.hariIni();

    var kunciProgram = murid.program || 'diploma';
    var tahap = +murid.hifz || 0;
    var halaman = julatHalaman(kunciProgram, tahap);

    var hasil = {
      muridId: murid.id,
      nama: murid.nama,
      program: kunciProgram,
      namaProgram: program(kunciProgram).nama,
      tahap: tahap,
      namaTahap: namaTahap(kunciProgram, tahap),
      adaSukatan: !!halaman,
      hariBaki: Math.max(0, bezaHari(hariIni, tarikhAkhir())),
      semesterTamat: bezaHari(hariIni, tarikhAkhir()) < 0
    };

    if (!halaman) { return hasil; }

    var rekod = rekodHafazan(murid.id);
    var dihantar = Math.min(Math.max(rekod.halaman, halaman.mula - 1), halaman.habis);
    var sudah = Math.max(0, dihantar - halaman.mula + 1);

    hasil.juzMula = halaman.juzMula;
    hasil.juzHabis = halaman.juzHabis;
    hasil.halamanMula = halaman.mula;
    hasil.halamanHabis = halaman.habis;
    hasil.jumlah = halaman.jumlah;
    hasil.halamanDihantar = rekod.halaman;
    hasil.tarikhDihantar = rekod.tarikh;
    hasil.sudah = sudah;
    hasil.baki = halaman.jumlah - sudah;
    hasil.peratus = CT.util.peratus(sudah, halaman.jumlah);
    hasil.luarJulat = rekod.halaman > 0 &&
      (rekod.halaman < halaman.mula || rekod.halaman > halaman.habis);

    // Kadar diperlukan bagi baki hari.
    hasil.kadarPerlu = hasil.hariBaki > 0 ? hasil.baki / hasil.hariBaki : null;

    /* Kadar sebenar setakat ini. Hanya bermakna apabila murid mempunyai
       sekurang-kurangnya dua hari rekod berlainan — satu hari sahaja akan
       memberi angka yang mengelirukan. */
    var hariBerlalu = rekod.tarikhPertama ? bezaHari(rekod.tarikhPertama, hariIni) + 1 : 0;
    hasil.hariRekod = rekod.bilanganHari;
    hasil.hariBerlalu = hariBerlalu;
    hasil.kadarSemasa = (rekod.bilanganHari >= 2 && hariBerlalu > 1 && sudah > 0)
      ? sudah / hariBerlalu
      : null;

    hasil.status = nilaiStatus(hasil);
    return hasil;
  }

  /* Ambang kadar: 1 halaman sehari dianggap kadar biasa hafazan harian,
     lebih 2 halaman sehari dianggap terlalu berat untuk baki hari yang ada. */
  var AMBANG_SELESA = 1;
  var AMBANG_BERAT = 2;

  function nilaiStatus(d) {
    if (d.baki <= 0) { return { kunci: 'cukup', teks: 'Sukatan cukup' }; }
    if (d.semesterTamat) { return { kunci: 'tamat', teks: 'Semester tamat' }; }
    if (d.hariBaki <= 0) { return { kunci: 'genting', teks: 'Hari terakhir' }; }
    if (d.kadarPerlu <= AMBANG_SELESA) { return { kunci: 'ikut', teks: 'Ikut jadual' }; }
    if (d.kadarPerlu <= AMBANG_BERAT) { return { kunci: 'pantau', teks: 'Perlu dipantau' }; }
    return { kunci: 'kejar', teks: 'Perlu dikejar' };
  }

  function kiraSemua(hariIni) {
    return CT.store.senaraiMurid().map(function (m) { return kira(m, hariIni); });
  }

  CT.sukatan = {
    JUMLAH_HALAMAN: JUMLAH_HALAMAN,
    JUZ_MULA: JUZ_MULA,
    PROGRAM: PROGRAM,
    TARIKH_AKHIR_LALAI: TARIKH_AKHIR_LALAI,
    program: program,
    namaTahap: namaTahap,
    julatJuz: julatJuz,
    julatHalaman: julatHalaman,
    rekodHafazan: rekodHafazan,
    rekodTerakhirSebelum: rekodTerakhirSebelum,
    juzUntukHalaman: juzUntukHalaman,
    cadanganSambungan: cadanganSambungan,
    bezaHari: bezaHari,
    tarikhAkhir: tarikhAkhir,
    kira: kira,
    kiraSemua: kiraSemua
  };
})();

</script>

<script>
/* js/ui.js */
/* ClassTrack — komponen antara muka yang dikongsi (toast, lapisan, pemilih tarikh). */

window.CT = window.CT || {};

(function () {
  'use strict';

  var u = CT.util;
  var masaToast = null;

  function toast(mesej) {
    var kotak = document.getElementById('toast');
    if (!kotak) { return; }
    kotak.textContent = mesej;
    kotak.classList.remove('tersembunyi');
    clearTimeout(masaToast);
    masaToast = setTimeout(function () { kotak.classList.add('tersembunyi'); }, 2600);
  }

  /* ---------- Lapisan (tetingkap bertindan) ---------- */
  var tutupTerakhir = null;

  function bukaLapisan(tajuk, kandungan, bilaTutup) {
    var lapisan = document.getElementById('lapisan');
    document.getElementById('lapisan-tajuk').textContent = tajuk;
    var kotak = document.getElementById('lapisan-kandungan');
    kotak.innerHTML = '';
    if (typeof kandungan === 'string') { kotak.innerHTML = kandungan; }
    else if (kandungan) { kotak.appendChild(kandungan); }
    hiasSemua(kotak);
    lapisan.classList.remove('tersembunyi');
    tutupTerakhir = bilaTutup || null;
    kotak.scrollTop = 0;
    return kotak;
  }

  function tutupLapisan() {
    document.getElementById('lapisan').classList.add('tersembunyi');
    document.getElementById('lapisan-kandungan').innerHTML = '';
    if (tutupTerakhir) { var f = tutupTerakhir; tutupTerakhir = null; f(); }
  }

  function sahkan(tajuk, mesej, bilaSetuju, labelSetuju) {
    var kotak = document.createElement('div');
    kotak.innerHTML =
      '<p class="kecil" style="margin-bottom:16px">' + u.selamat(mesej) + '</p>' +
      '<div class="baris-lipat">' +
      '<button class="butang butang-bahaya tumbuh" data-ya>' +
      u.selamat(labelSetuju || 'Ya, teruskan') + '</button>' +
      '<button class="butang butang-luar tumbuh" data-tidak>Batal</button>' +
      '</div>';
    kotak.querySelector('[data-ya]').addEventListener('click', function () {
      tutupLapisan();
      bilaSetuju();
    });
    kotak.querySelector('[data-tidak]').addEventListener('click', tutupLapisan);
    bukaLapisan(tajuk, kotak);
  }

  /* Pelayar memaparkan <input type="date"> dan <input type="time"> mengikut
     tetapan tempatan peranti (kadangkala MM/DD/YYYY atau 24 jam). Lapisan ini
     menutup paparan asal dengan format Malaysia — tarikh DD/MM/YYYY dan masa
     12 jam AM/PM — sambil mengekalkan pemilih asli peranti. */
  function hiasMedan(medan, format, kosongTeks) {
    var bekas = document.createElement('span');
    bekas.className = 'medan-hias';
    medan.parentNode.insertBefore(bekas, medan);
    bekas.appendChild(medan);

    var papar = document.createElement('span');
    papar.className = 'medan-papar';
    bekas.appendChild(papar);

    function segar() {
      papar.textContent = medan.value ? format(medan.value) : (kosongTeks || 'Pilih');
    }
    medan.addEventListener('change', segar);
    medan.addEventListener('input', segar);
    segar();
    medan.segarPaparan = segar;
    return bekas;
  }

  function hiasTarikh(medan) {
    return hiasMedan(medan, u.tarikhRingkas, 'Pilih tarikh');
  }

  function hiasMasa(medan) {
    return hiasMedan(medan, u.masa12, 'Pilih masa');
  }

  /* Hias semua medan tarikh/masa dalam sesuatu bekas. */
  function hiasSemua(bekas) {
    bekas.querySelectorAll('input[type="date"]').forEach(hiasTarikh);
    bekas.querySelectorAll('input[type="time"]').forEach(hiasMasa);
    return bekas;
  }

  /* ---------- Pemilih tarikh dengan butang hari sebelum / berikutnya ---------- */
  function pemilihTarikh(tarikh, bilaTukar, pilihan) {
    pilihan = pilihan || {};
    var kotak = document.createElement('div');
    kotak.className = 'kad';
    kotak.innerHTML =
      '<div class="pilih-tarikh">' +
      '<button class="butang-ikon" type="button" data-sebelum aria-label="Hari sebelumnya">&lsaquo;</button>' +
      '<input type="date" value="' + u.selamat(tarikh) + '" aria-label="Pilih tarikh">' +
      '<button class="butang-ikon" type="button" data-selepas aria-label="Hari berikutnya">&rsaquo;</button>' +
      '</div>' +
      '<div class="baris-antara jarak-atas">' +
      '<p class="kecil tebal" data-teks-tarikh>' + u.selamat(u.tarikhPenuh(tarikh)) + '</p>' +
      '<button class="butang butang-lembut butang-kecil" type="button" data-hari-ini>Hari Ini</button>' +
      '</div>' +
      (pilihan.tambahan || '');

    var medan = kotak.querySelector('input[type="date"]');
    hiasTarikh(medan);

    function tukar(baru) {
      if (!u.sahKunci(baru)) { return; }
      medan.value = baru;
      if (medan.segarPaparan) { medan.segarPaparan(); }
      kotak.querySelector('[data-teks-tarikh]').textContent = u.tarikhPenuh(baru);
      bilaTukar(baru);
    }

    kotak.querySelector('[data-sebelum]').addEventListener('click', function () {
      tukar(u.tambahHari(medan.value || u.hariIni(), -1));
    });
    kotak.querySelector('[data-selepas]').addEventListener('click', function () {
      tukar(u.tambahHari(medan.value || u.hariIni(), 1));
    });
    kotak.querySelector('[data-hari-ini]').addEventListener('click', function () {
      tukar(u.hariIni());
    });
    medan.addEventListener('change', function () {
      if (u.sahKunci(medan.value)) { tukar(medan.value); }
      else { medan.value = tarikh; }
    });

    return kotak;
  }

  /* ---------- Notis cuti ---------- */
  function notisCuti(tarikh) {
    var senarai = CT.cuti.cutiPada(tarikh);
    if (!senarai.length) { return null; }
    var kotak = document.createElement('div');
    kotak.className = 'notis notis-cuti';
    kotak.innerHTML = '<b>Cuti umum:</b> ' + senarai.map(function (c) {
      return u.selamat(c.nama) + (c.anggaran ? ' <span class="lencana lencana-emas">anggaran</span>' : '');
    }).join(', ');
    return kotak;
  }

  function kosong(tajuk, mesej, butang) {
    var kotak = document.createElement('div');
    kotak.className = 'kosong-kotak';
    kotak.innerHTML = '<b>' + u.selamat(tajuk) + '</b><span class="kecil">' +
      u.selamat(mesej) + '</span>';
    if (butang) { kotak.appendChild(butang); }
    return kotak;
  }

  function pilihanNombor(dari, hingga, nilai) {
    var html = '';
    for (var i = dari; i <= hingga; i++) {
      html += '<option value="' + i + '"' + (String(nilai) === String(i) ? ' selected' : '') +
        '>' + i + '</option>';
    }
    return html;
  }

  function el(html) {
    var bekas = document.createElement('div');
    bekas.innerHTML = html.trim();
    return bekas.firstElementChild;
  }

  CT.ui = {
    toast: toast,
    bukaLapisan: bukaLapisan,
    tutupLapisan: tutupLapisan,
    sahkan: sahkan,
    hiasTarikh: hiasTarikh,
    hiasMasa: hiasMasa,
    hiasSemua: hiasSemua,
    pemilihTarikh: pemilihTarikh,
    notisCuti: notisCuti,
    kosong: kosong,
    pilihanNombor: pilihanNombor,
    el: el
  };
})();

</script>

<script>
/* js/views/utama.js */
/* Tab Utama — ringkas: logo rasmi UIS dan satu butang besar "Ambil Kehadiran". */

window.CT = window.CT || {};
CT.views = CT.views || {};

CT.views.utama = (function () {
  'use strict';

  var u = CT.util;

  /* Logo rasmi UIS adalah TETAP. Ia datang daripada fail yang dihantar bersama
     aplikasi sahaja — folder assets, atau data terbenam dalam binaan satu fail.
     Tiada cara untuk pengguna aplikasi menukar, memuat naik atau memadamnya.
     Hanya orang yang mempunyai akses kepada repositori boleh menggantikan fail. */
  var FAIL_LOGO = ['assets/logo-uis.png', 'assets/logo-uis.jpg', 'assets/logo-uis.svg'];

  function sumberLogo() {
    // Binaan satu fail membenamkan logo terus sebagai data URI.
    if (typeof window.CT_LOGO_TERBENAM === 'string' && window.CT_LOGO_TERBENAM) {
      return [window.CT_LOGO_TERBENAM];
    }
    return window.CT_TIADA_FAIL_LOGO ? [] : FAIL_LOGO;
  }

  function bingkaiLogo() {
    var bingkai = document.createElement('div');
    bingkai.className = 'logo-bingkai';

    var imej = document.createElement('img');
    imej.className = 'logo-uis';
    imej.alt = 'Logo Universiti Islam Selangor';
    imej.draggable = false;
    imej.decoding = 'async';
    bingkai.appendChild(imej);

    // Logo hanya paparan: tiada pautan, tiada tindakan apabila ditekan.
    imej.addEventListener('click', function (e) { e.preventDefault(); });
    imej.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    var senarai = sumberLogo();
    var cubaan = 0;

    imej.addEventListener('error', function () {
      cubaan++;
      if (cubaan < senarai.length) {
        imej.src = senarai[cubaan];
        return;
      }
      bingkai.replaceWith(kotakLogoTiada());
    });

    if (senarai.length) { imej.src = senarai[0]; }
    else { return kotakLogoTiada(); }
    return bingkai;
  }

  /* Hanya muncul jika fail logo rasmi belum diletakkan dalam folder assets.
     Sengaja tiada butang: logo tidak boleh ditukar dari dalam aplikasi. */
  function kotakLogoTiada() {
    var kotak = document.createElement('div');
    kotak.className = 'logo-ganti';
    kotak.innerHTML =
      '<p class="tebal" style="color:var(--teks);margin-bottom:6px">Logo rasmi tiada</p>' +
      '<p class="kecil">Pentadbir perlu meletakkan fail logo rasmi UIS sebagai ' +
      '<code>assets/logo-uis.png</code> dalam projek.</p>';
    return kotak;
  }

  function render(skrin) {
    var kotak = document.createElement('div');
    kotak.className = 'utama-kotak';

    kotak.appendChild(bingkaiLogo());

    var tarikh = document.createElement('p');
    tarikh.className = 'kecil tebal';
    tarikh.textContent = u.tarikhPenuh(u.hariIni());
    kotak.appendChild(tarikh);

    var butang = document.createElement('button');
    butang.type = 'button';
    butang.className = 'butang butang-besar';
    butang.textContent = 'Ambil Kehadiran';
    butang.addEventListener('click', function () {
      CT.app.pergi('kehadiran', { tarikh: u.hariIni() });
    });
    kotak.appendChild(butang);

    skrin.appendChild(kotak);
  }

  return { tajuk: 'Utama', render: render };
})();

</script>

<script>
/* js/views/murid.js */
/* Tab Murid — senarai murid, carian, tambah murid dan profil murid.
   Profil hanya mengandungi: nama penuh, nombor matrik, nombor telefon,
   semester (1-8) dan Hifz/I'adah (1-8). Juz dan muka surat direkodkan
   dalam tab Rekod, bukan di sini. */

window.CT = window.CT || {};
CT.views = CT.views || {};

CT.views.murid = (function () {
  'use strict';

  var u = CT.util;
  var carian = '';

  function tapis(senarai) {
    var cari = carian.trim().toLowerCase();
    if (!cari) { return senarai; }
    return senarai.filter(function (m) {
      return String(m.nama || '').toLowerCase().indexOf(cari) !== -1 ||
        String(m.matrik || '').toLowerCase().indexOf(cari) !== -1 ||
        String(m.telefon || '').toLowerCase().indexOf(cari) !== -1;
    });
  }

  function kadMurid(m) {
    var butang = document.createElement('button');
    butang.type = 'button';
    butang.className = 'murid-kad';
    butang.innerHTML =
      '<span class="avatar">' + u.selamat(u.huruf(m.nama)) + '</span>' +
      '<span class="tumbuh">' +
      '<span class="murid-nama">' + u.selamat(m.nama) + '</span><br>' +
      '<span class="kecil">' + u.selamat(m.matrik || 'Tiada nombor matrik') + '</span>' +
      '</span>' +
      '<span class="baris-lipat" style="flex:0 0 auto;justify-content:flex-end">' +
      '<span class="lencana">Sem ' + u.selamat(m.semester || '-') + '</span>' +
      '<span class="lencana lencana-biru">' +
      u.selamat(CT.sukatan.namaTahap(m.program, m.hifz || '-')) + '</span>' +
      '</span>';
    butang.addEventListener('click', function () { bukaProfil(m.id); });
    return butang;
  }

  /* ---------- Borang tambah / sunting ---------- */
  function borang(sedia) {
    var m = sedia || {};
    var kotak = document.createElement('div');
    kotak.innerHTML =
      '<div class="medan"><label for="m-nama">Nama penuh</label>' +
      '<input id="m-nama" type="text" value="' + u.selamat(m.nama || '') +
      '" placeholder="Nama penuh murid" autocomplete="off"></div>' +

      '<div class="medan"><label for="m-matrik">Nombor matrik</label>' +
      '<input id="m-matrik" type="text" value="' + u.selamat(m.matrik || '') +
      '" placeholder="Contoh: UIS2026001" autocomplete="off"></div>' +

      '<div class="medan"><label for="m-telefon">Nombor telefon</label>' +
      '<input id="m-telefon" type="tel" value="' + u.selamat(m.telefon || '') +
      '" placeholder="Contoh: 012-3456789" autocomplete="off"></div>' +

      '<div class="medan"><label for="m-program">Program</label>' +
      '<select id="m-program">' +
      '<option value="diploma"' + (m.program !== 'ijazah' ? ' selected' : '') +
      '>Diploma (Hifz 1-6)</option>' +
      '<option value="ijazah"' + (m.program === 'ijazah' ? ' selected' : '') +
      '>Ijazah (I\'adah 1-8)</option>' +
      '</select></div>' +

      '<div class="medan-dua">' +
      '<div class="medan"><label for="m-semester">Semester</label>' +
      '<select id="m-semester">' + CT.ui.pilihanNombor(1, 8, m.semester || 1) + '</select></div>' +
      '<div class="medan"><label for="m-hifz">Hifz / I\'adah</label>' +
      '<select id="m-hifz">' + CT.ui.pilihanNombor(1, 8, m.hifz || 1) + '</select></div>' +
      '</div>' +

      '<button class="butang butang-penuh" type="button" data-simpan>Simpan murid</button>';

    kotak.querySelector('[data-simpan]').addEventListener('click', function () {
      var nama = kotak.querySelector('#m-nama').value.trim();
      if (!nama) { CT.ui.toast('Sila isi nama penuh murid.'); return; }

      CT.store.simpanMurid({
        id: m.id,
        dicipta: m.dicipta,
        nama: nama,
        matrik: kotak.querySelector('#m-matrik').value.trim(),
        telefon: kotak.querySelector('#m-telefon').value.trim(),
        program: kotak.querySelector('#m-program').value,
        semester: +kotak.querySelector('#m-semester').value,
        hifz: +kotak.querySelector('#m-hifz').value
      });
      CT.ui.tutupLapisan();
      CT.ui.toast(m.id ? 'Profil murid dikemas kini.' : 'Murid baharu ditambah.');
      CT.app.segarSemula();
    });

    return kotak;
  }

  function bukaBorang(sedia) {
    CT.ui.bukaLapisan(sedia ? 'Sunting Profil Murid' : 'Tambah Murid', borang(sedia));
  }

  /* ---------- Profil ---------- */
  function bukaProfil(id) {
    var m = CT.store.ambilMurid(id);
    if (!m) { return; }

    var kotak = document.createElement('div');
    kotak.innerHTML =
      '<div class="kad">' +
      '<div class="baris"><span class="avatar">' + u.selamat(u.huruf(m.nama)) + '</span>' +
      '<span class="tumbuh"><span class="murid-nama">' + u.selamat(m.nama) + '</span></span></div>' +
      '<div class="rekod-medan">' +
      '<div><b>Nombor matrik</b>' + u.selamat(m.matrik || 'Tiada') + '</div>' +
      '<div><b>Nombor telefon</b>' + u.selamat(m.telefon || 'Tiada') + '</div>' +
      '<div><b>Program</b>' + u.selamat(CT.sukatan.program(m.program).nama) + '</div>' +
      '<div><b>Semester</b>' + u.selamat(m.semester || '-') + '</div>' +
      '<div><b>Hifz / I\'adah</b>' + u.selamat(m.hifz || '-') + '</div>' +
      '</div></div>' +

      '<div class="baris-lipat jarak-atas">' +
      '<button class="butang tumbuh" type="button" data-sunting>Sunting profil</button>' +
      '<button class="butang butang-luar tumbuh" type="button" data-rekod>Lihat rekod hari ini</button>' +
      '</div>' +
      '<button class="butang butang-bahaya butang-penuh jarak-atas" type="button" data-padam>' +
      'Padam murid</button>';

    kotak.querySelector('[data-sunting]').addEventListener('click', function () {
      bukaBorang(m);
    });
    kotak.querySelector('[data-rekod]').addEventListener('click', function () {
      CT.ui.tutupLapisan();
      CT.app.pergi('rekod', { tarikh: u.hariIni() });
    });
    kotak.querySelector('[data-padam]').addEventListener('click', function () {
      CT.ui.sahkan('Padam murid',
        'Padam ' + m.nama + ' bersama semua kehadiran, rekod dan nota murid ini? ' +
        'Tindakan ini tidak boleh dibatalkan.',
        function () {
          CT.store.padamMurid(m.id);
          CT.ui.toast('Murid dipadam.');
          CT.app.segarSemula();
        }, 'Ya, padam');
    });

    CT.ui.bukaLapisan('Profil Murid', kotak);
  }

  /* ---------- Data contoh (pilihan guru) ---------- */
  function muatContoh() {
    var contoh = [
      { nama: 'Ahmad Danial bin Rosli', matrik: 'UIS2026001', telefon: '012-3456789', program: 'diploma', semester: 1, hifz: 1 },
      { nama: 'Nur Aisyah binti Kamal', matrik: 'UIS2026002', telefon: '013-2233445', program: 'diploma', semester: 2, hifz: 3 },
      { nama: 'Muhammad Haziq bin Zainal', matrik: 'UIS2026003', telefon: '011-98765432', program: 'diploma', semester: 3, hifz: 2 },
      { nama: 'Siti Khadijah binti Anuar', matrik: 'UIS2026004', telefon: '019-7766554', program: 'ijazah', semester: 4, hifz: 5 },
      { nama: 'Amir Hamzah bin Ibrahim', matrik: 'UIS2026005', telefon: '017-4455667', program: 'ijazah', semester: 5, hifz: 4 }
    ];
    contoh.forEach(function (m) { CT.store.simpanMurid(m); });
    CT.ui.toast('5 murid contoh ditambah.');
    CT.app.segarSemula();
  }

  function render(skrin) {
    var semua = CT.store.senaraiMurid();

    var kepala = document.createElement('div');
    kepala.className = 'seksyen';
    kepala.innerHTML =
      '<div class="medan" style="margin-bottom:10px">' +
      '<input type="search" id="cari-murid" placeholder="Cari nama, matrik atau telefon" ' +
      'value="' + u.selamat(carian) + '" aria-label="Cari murid"></div>' +
      '<button class="butang butang-penuh" type="button" data-tambah>+ Tambah Murid</button>';
    kepala.querySelector('[data-tambah]').addEventListener('click', function () { bukaBorang(null); });

    var medanCari = kepala.querySelector('#cari-murid');
    medanCari.addEventListener('input', function () {
      carian = medanCari.value;
      lukisSenarai();
    });
    skrin.appendChild(kepala);

    var seksyen = document.createElement('div');
    seksyen.className = 'seksyen';
    skrin.appendChild(seksyen);

    function lukisSenarai() {
      seksyen.innerHTML = '';
      if (!semua.length) {
        var butang = document.createElement('button');
        butang.type = 'button';
        butang.className = 'butang butang-luar butang-kecil jarak-atas';
        butang.textContent = 'Muat 5 murid contoh';
        butang.addEventListener('click', muatContoh);
        seksyen.appendChild(CT.ui.kosong('Belum ada murid',
          'Tekan "Tambah Murid" untuk memasukkan murid pertama anda.', butang));
        return;
      }

      var ditapis = tapis(semua);
      var kira = document.createElement('p');
      kira.className = 'seksyen-tajuk';
      kira.textContent = ditapis.length + ' daripada ' + semua.length + ' murid';
      seksyen.appendChild(kira);

      if (!ditapis.length) {
        seksyen.appendChild(CT.ui.kosong('Tiada padanan',
          'Tiada murid sepadan dengan carian "' + carian + '".'));
        return;
      }

      var senarai = document.createElement('div');
      senarai.className = 'senarai';
      ditapis.forEach(function (m) { senarai.appendChild(kadMurid(m)); });
      seksyen.appendChild(senarai);
    }

    lukisSenarai();
  }

  return { tajuk: 'Murid', render: render, bukaBorang: bukaBorang };
})();

</script>

<script>
/* js/views/kehadiran.js */
/* Tab Kehadiran — dua pilihan sahaja bagi setiap murid: Hadir atau Tidak hadir.
   Bagi murid yang tidak hadir, guru boleh menanda sama ada ketidakhadiran itu
   Dimaklum atau Tidak dimaklum, dan menulis nota ringkas.
   Rekod disimpan mengikut tarikh dan terus dipaparkan dalam tab Kalendar dan Rekod. */

window.CT = window.CT || {};
CT.views = CT.views || {};

CT.views.kehadiran = (function () {
  'use strict';

  var u = CT.util;
  var tarikh = null;
  var draf = {};
  var drafButiran = {};
  var belumSimpan = false;

  function muatDraf() {
    draf = Object.assign({}, CT.store.kehadiranTarikh(tarikh));
    drafButiran = {};
    var simpan = CT.store.butiranKehadiran(tarikh);
    Object.keys(simpan).forEach(function (id) {
      drafButiran[id] = Object.assign({}, simpan[id]);
    });
    belumSimpan = false;
  }

  function kiraan(murid) {
    var hadir = 0, tidak = 0, dimaklum = 0, tidakDimaklum = 0;
    murid.forEach(function (m) {
      if (draf[m.id] === 'hadir') { hadir++; return; }
      if (draf[m.id] !== 'tidak') { return; }
      tidak++;
      var b = drafButiran[m.id];
      if (b && b.maklum === 'dimaklum') { dimaklum++; }
      else if (b && b.maklum === 'tidak-dimaklum') { tidakDimaklum++; }
    });
    return {
      hadir: hadir, tidak: tidak, jumlah: murid.length,
      belum: murid.length - hadir - tidak,
      dimaklum: dimaklum, tidakDimaklum: tidakDimaklum,
      belumDitanda: tidak - dimaklum - tidakDimaklum
    };
  }

  function render(skrin, param) {
    if (param && param.tarikh && u.sahKunci(param.tarikh)) {
      tarikh = param.tarikh;
      muatDraf();
    } else if (!tarikh) {
      tarikh = u.hariIni();
      muatDraf();
    } else if (!belumSimpan) {
      muatDraf();
    }

    var murid = CT.store.senaraiMurid();

    /* Pemilih tarikh */
    skrin.appendChild(CT.ui.pemilihTarikh(tarikh, function (baru) {
      tarikh = baru;
      muatDraf();
      CT.app.segarSemula();
    }));

    /* Notis cuti umum */
    var cuti = CT.ui.notisCuti(tarikh);
    if (cuti) {
      cuti.classList.add('jarak-atas');
      skrin.appendChild(cuti);
    }

    if (!murid.length) {
      var kosong = CT.ui.kosong('Belum ada murid',
        'Tambah murid dalam tab Murid sebelum mengambil kehadiran.');
      kosong.classList.add('jarak-atas');
      skrin.appendChild(kosong);
      return;
    }

    /* Statistik */
    var statistik = document.createElement('div');
    statistik.className = 'statistik jarak-atas';
    skrin.appendChild(statistik);

    var ringkasTidak = document.createElement('p');
    ringkasTidak.className = 'kecil jarak-atas';
    skrin.appendChild(ringkasTidak);

    function lukisStatistik() {
      var k = kiraan(murid);
      statistik.innerHTML =
        '<div class="stat"><b style="color:var(--hijau)">' + k.hadir + '</b><span>Hadir</span></div>' +
        '<div class="stat"><b style="color:var(--merah)">' + k.tidak + '</b><span>Tidak hadir</span></div>' +
        '<div class="stat"><b>' + u.peratus(k.hadir, k.jumlah) + '%</b><span>Peratus kehadiran</span></div>';

      if (k.tidak) {
        ringkasTidak.innerHTML = 'Tidak hadir: <b>' + k.dimaklum + '</b> dimaklum &middot; <b>' +
          k.tidakDimaklum + '</b> tidak dimaklum' +
          (k.belumDitanda ? ' &middot; <b>' + k.belumDitanda + '</b> belum ditanda' : '');
      } else {
        ringkasTidak.textContent = '';
      }
    }

    /* Senarai murid */
    var senarai = document.createElement('div');
    senarai.className = 'senarai jarak-atas';
    skrin.appendChild(senarai);

    murid.forEach(function (m) {
      var baris = document.createElement('div');
      baris.className = 'hadir-baris';
      baris.innerHTML =
        '<div class="hadir-atas">' +
        '<span class="avatar">' + u.selamat(u.huruf(m.nama)) + '</span>' +
        '<span class="tumbuh"><span class="murid-nama">' + u.selamat(m.nama) + '</span><br>' +
        '<span class="kecil">' + u.selamat(m.matrik || 'Tiada matrik') + '</span></span>' +
        '<span class="segmen">' +
        '<button type="button" data-nilai="hadir">Hadir</button>' +
        '<button type="button" data-nilai="tidak">Tidak</button>' +
        '</span>' +
        '</div>' +
        '<div class="hadir-butiran tersembunyi">' +
        '<span class="segmen segmen-maklum">' +
        '<button type="button" data-maklum="dimaklum">Dimaklum</button>' +
        '<button type="button" data-maklum="tidak-dimaklum">Tidak dimaklum</button>' +
        '</span>' +
        '<input type="text" class="nota-tidak-hadir" maxlength="200" ' +
        'placeholder="Nota ringkas (pilihan)" aria-label="Nota ketidakhadiran">' +
        '</div>';

      var butangHadir = baris.querySelector('[data-nilai="hadir"]');
      var butangTidak = baris.querySelector('[data-nilai="tidak"]');
      var butiran = baris.querySelector('.hadir-butiran');
      var butangMaklum = baris.querySelectorAll('[data-maklum]');
      var medanNota = baris.querySelector('.nota-tidak-hadir');

      function segar() {
        var tidakHadir = draf[m.id] === 'tidak';
        butangHadir.classList.toggle('pilih-hadir', draf[m.id] === 'hadir');
        butangTidak.classList.toggle('pilih-tidak', tidakHadir);
        butiran.classList.toggle('tersembunyi', !tidakHadir);

        var b = drafButiran[m.id] || {};
        Array.prototype.forEach.call(butangMaklum, function (x) {
          x.classList.toggle('pilih-maklum', b.maklum === x.getAttribute('data-maklum'));
        });
        if (medanNota.value !== (b.nota || '')) { medanNota.value = b.nota || ''; }
      }

      function pilih(nilai) {
        draf[m.id] = draf[m.id] === nilai ? undefined : nilai;
        if (!draf[m.id]) { delete draf[m.id]; }
        // Butiran hanya bermakna untuk murid yang tidak hadir.
        if (draf[m.id] !== 'tidak') { delete drafButiran[m.id]; }
        belumSimpan = true;
        segar();
        lukisStatistik();
      }

      butangHadir.addEventListener('click', function () { pilih('hadir'); });
      butangTidak.addEventListener('click', function () { pilih('tidak'); });

      Array.prototype.forEach.call(butangMaklum, function (x) {
        x.addEventListener('click', function () {
          var nilai = x.getAttribute('data-maklum');
          var b = drafButiran[m.id] || {};
          b.maklum = b.maklum === nilai ? '' : nilai;
          if (!b.maklum) { delete b.maklum; }
          drafButiran[m.id] = b;
          belumSimpan = true;
          segar();
          lukisStatistik();
        });
      });

      medanNota.addEventListener('input', function () {
        var b = drafButiran[m.id] || {};
        b.nota = medanNota.value;
        drafButiran[m.id] = b;
        belumSimpan = true;
      });

      baris.segar = segar;
      segar();
      senarai.appendChild(baris);
    });

    lukisStatistik();

    /* Butang tindakan */
    var bar = document.createElement('div');
    bar.className = 'bar-tindakan';
    bar.innerHTML =
      '<button class="butang butang-luar tumbuh" type="button" data-semua>Semua hadir</button>' +
      '<button class="butang tumbuh" type="button" data-simpan>Simpan kehadiran</button>';

    bar.querySelector('[data-semua]').addEventListener('click', function () {
      murid.forEach(function (m) {
        draf[m.id] = 'hadir';
        delete drafButiran[m.id];
      });
      belumSimpan = true;
      Array.prototype.forEach.call(senarai.children, function (b) { b.segar && b.segar(); });
      lukisStatistik();
      CT.ui.toast('Semua murid ditanda hadir. Tekan "Simpan kehadiran".');
    });

    bar.querySelector('[data-simpan]').addEventListener('click', function () {
      var bersih = {};
      var bersihButiran = {};

      Object.keys(draf).forEach(function (id) {
        if (draf[id] !== 'hadir' && draf[id] !== 'tidak') { return; }
        bersih[id] = draf[id];
        if (draf[id] !== 'tidak') { return; }

        var b = drafButiran[id] || {};
        var nota = String(b.nota || '').trim();
        if (b.maklum || nota) {
          bersihButiran[id] = {};
          if (b.maklum) { bersihButiran[id].maklum = b.maklum; }
          if (nota) { bersihButiran[id].nota = nota; }
        }
      });

      CT.store.simpanKehadiran(tarikh, bersih);
      CT.store.simpanButiranKehadiran(tarikh, bersihButiran);
      belumSimpan = false;

      var k = kiraan(murid);
      CT.ui.toast('Kehadiran ' + u.tarikhRingkas(tarikh) + ' disimpan (' +
        k.hadir + ' hadir, ' + k.tidak + ' tidak hadir).');
    });

    skrin.appendChild(bar);

    var pautan = document.createElement('button');
    pautan.type = 'button';
    pautan.className = 'butang butang-lembut butang-penuh jarak-atas';
    pautan.textContent = 'Buka rekod murid untuk tarikh ini';
    pautan.addEventListener('click', function () {
      CT.app.pergi('rekod', { tarikh: tarikh });
    });
    skrin.appendChild(pautan);
  }

  function tetapTarikh(baru) {
    if (u.sahKunci(baru)) { tarikh = baru; muatDraf(); }
  }

  return { tajuk: 'Kehadiran', render: render, tetapTarikh: tetapTarikh };
})();

</script>

<script>
/* js/views/kalendar.js */
/* Tab Kalendar — kalendar bulanan aktif.
   Menggabungkan cuti Persekutuan + Kuala Lumpur + Selangor secara automatik
   (tiada pemilih negeri dipaparkan). Rekod murid tidak disenaraikan di sini
   kerana ia mempunyai tab sendiri. */

window.CT = window.CT || {};
CT.views = CT.views || {};

CT.views.kalendar = (function () {
  'use strict';

  var u = CT.util;
  var pilih = null;   // tarikh dipilih
  var lihat = null;   // { tahun, bulan }

  function pastikanKeadaan(param) {
    if (param && param.tarikh && u.sahKunci(param.tarikh)) { pilih = param.tarikh; }
    if (!pilih) { pilih = u.hariIni(); }
    var p = u.pecah(pilih);
    if (!lihat || (param && param.tarikh)) { lihat = { tahun: p.tahun, bulan: p.bulan }; }
  }

  function tukarBulan(langkah) {
    var bulan = lihat.bulan + langkah;
    var tahun = lihat.tahun;
    while (bulan > 12) { bulan -= 12; tahun++; }
    while (bulan < 1) { bulan += 12; tahun--; }
    lihat = { tahun: tahun, bulan: bulan };
    CT.app.segarSemula();
  }

  function tandaTarikh() {
    var tanda = {};
    CT.store.tarikhAdaRekod().forEach(function (t) {
      tanda[t] = tanda[t] || {};
      tanda[t].rekod = true;
    });
    CT.store.tarikhAdaAcara().forEach(function (t) {
      tanda[t] = tanda[t] || {};
      tanda[t].acara = true;
    });
    return tanda;
  }

  function gridBulan() {
    var kad = document.createElement('div');
    kad.className = 'kad';

    var kepala = document.createElement('div');
    kepala.className = 'kal-kepala';
    kepala.innerHTML =
      '<button class="butang-ikon" type="button" data-bulan-sebelum aria-label="Bulan sebelumnya">&lsaquo;</button>' +
      '<span class="kal-bulan">' + u.namaBulan(lihat.bulan) + ' ' + lihat.tahun + '</span>' +
